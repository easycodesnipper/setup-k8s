---
# group_vars/all/all.yml

docker_repo_base_url: "https://mirrors.huaweicloud.com/docker-ce"

containerd_debug: true
containerd_registry_mirror_enabled: true

### Common Variables
k8s_version: "1.34.2"

k8s_image_repository: "k8s.m.daocloud.io"

# Base domain for all plugin Ingress hosts: <plugin_name>.{{ k8s_host_domain }}
k8s_host_domain: "localdomain"

### Plugins Variables
k8s_plugin_metallb_ip_address_pool_default:
  - "10.17.3.240-10.17.3.250"

k8s_plugin_manifest_proxy: "https://ghproxy.net"

k8s_plugin_harbor_mirrors:
  - { name: "docker.io", url: "https://docker.m.daocloud.io", type: "docker-registry" }
  - { name: "registry.k8s.io", url: "https://k8s.m.daocloud.io", type: "docker-registry" }
  - { name: "gcr.io", url: "https://gcr.m.daocloud.io", type: "docker-registry" }
  - { name: "ghcr.io", url: "https://ghcr.m.daocloud.io", type: "docker-registry" }
  - { name: "quay.io", url: "https://quay.m.daocloud.io", type: "docker-registry" }

# Vault Variables
k8s_plugin_gitlab_smtp_auth_password: "{{ vault_k8s_plugin_gitlab_smtp_auth_password }}"
