[masters]
k8s-master ansible_host=10.17.3.120 ansible_user=user

[workers]
k8s-worker-1 ansible_host=10.17.3.48 ansible_user=user
k8s-worker-2 ansible_host=10.17.3.6 ansible_user=user

[k8s_cluster:children]
masters
workers

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
