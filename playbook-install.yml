---
# playbook-install.yml
- name: Prepare Kubernetes cluster
  hosts: k8s_cluster
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Test network reachability
      ansible.builtin.ping:
      tags: always
  roles:
    - role: prerequisite
      tags: prereq
    - role: containerd
      tags: containerd
    - role: kubernetes
      tags: kubernetes
  tags: prepare

- name: Initialize Kubernetes cluster
  hosts: controllers
  become: true
  roles:
    - initialize
  tags: init

- name: Join worker nodes to cluster
  hosts: workers
  become: true
  roles:
    - join
  tags: join

- name: Install CNI plugin
  hosts: controllers
  become: false
  gather_facts: false
  roles:
    - role: cni
  tags: cni

- name: Confirmation gate to install plugins
  hosts: localhost
  gather_facts: false
  vars:
    k8s_plugins_enabled_final: "{{ (lookup('env', 'K8S_PLUGINS_ENABLED') or k8s_plugins_enabled | default(true)) | bool }}"
  tasks:
    - name: Prompt for plugin installation confirmation
      ansible.builtin.pause:
        prompt: |
          #########################################################
          ###                                                   ###
          ###                  Information                      ###
          ###                                                   ###
          ###  You are about to install Kubernetes plugins.     ###
          ###                                                   ###
          ###  Type 'y' to confirm, any other key to abort.     ###
          ###                                                   ###
          #########################################################
      register: plugin_confirm
      when:
        - not ansible_check_mode
        - k8s_plugins_enabled_final
        - k8s_install_plugin_need_confirm | default(true) | bool

    - name: Set decision fact
      ansible.builtin.set_fact:
        should_install_plugins: "{{ plugin_confirm.user_input | default('y') | lower in ['y', 'yes'] }}"
      when: k8s_plugins_enabled_final
  tags: postinstall-plugins

- name: Post install Kubernetes plugins
  import_playbook: playbook-plugins.yml
  when:
    - hostvars['localhost']['should_install_plugins'] | default(true) | bool
  tags: postinstall-plugins
