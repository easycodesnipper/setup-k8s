---
- name: Prepare Kubernetes cluster
  hosts: k8s_cluster
  become: true
  roles:
    - role: prerequisite
      tags: prereq
    - role: containerd
      tags: containerd
    - role: kubernetes
      tags: kubernetes
  tags: prepare

- name: Initialize Kubernetes cluster
  become: true
  hosts: controllers
  roles:
    - initialize
  tags: init

- name: Join worker nodes to cluster
  hosts: workers
  roles:
    - join
  tags: join
