---
- name: Prepare Kubernetes cluster
  hosts: k8s_cluster
  become: true
  roles:
    - role: prerequisite
      tags: prereq
    - role: containerd
      tags: containerd
    - role: kubernetes
      tags: kubernetes
  tags: prepare

- name: Initialize Kubernetes cluster
  become: true
  hosts: controllers
  roles:
    - initialize
  tags: init

- name: Join worker nodes to cluster
  hosts: workers
  roles:
    - join
  tags: join

- name: Install Kubernetes plugins (optional)
  hosts: controllers
  gather_facts: false
  vars:
    k8s_plugins_enabled_final: >
      {{
        lookup('env', 'K8S_PLUGINS_ENABLED', default=k8s_plugins_enabled | default(true)) | bool
      }}
  tasks:
    - name: Conditionally install Kubernetes plugins
      when: k8s_plugins_enabled_final
      block:
        - name: Confirm plugin installation
          when: k8s_install_plugin_need_confirm | default(true) | bool
          ansible.builtin.pause:
            prompt: "Do you want to post-install Kubernetes plugins? (y/n)"
          register: plugin_confirm

        - name: Execute plugin installation role
          ansible.builtin.include_role:
            name: plugin
          when: >
            not (k8s_install_plugin_need_confirm | default(true) | bool)
            or
            (plugin_confirm.user_input | default('y') | lower in ['y', 'yes'])
  tags: plugin
