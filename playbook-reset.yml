---
- name: Reset Kubernetes cluster
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Reset kubeadm
      ansible.builtin.command: kubeadm reset -f
      changed_when: true
      failed_when: false

    - name: Remove CNI configuration
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: absent
      failed_when: false

    - name: Clean up HOME kube config
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: absent
      failed_when: false

    - name: Flush iptables rules
      ansible.builtin.shell: |
        iptables -F &&
        iptables -t nat -F &&
        iptables -t mangle -F &&
        iptables -X
      changed_when: true
      failed_when: false

    - name: Check if IPVS rules exist
      ansible.builtin.command: ipvsadm -Ln
      register: ipvs_rules
      changed_when: false
      failed_when: false

    - name: Clear IPVS rules
      ansible.builtin.command: ipvsadm --clear
      when: ipvs_rules.stdout != ""
      changed_when: true
      failed_when: false

    - name: Clean up flannel interface
      ansible.builtin.command: ip link delete cni0
      when: ansible_facts['interfaces'] is defined and 'cni0' in ansible_facts['interfaces']
      changed_when: true
      failed_when: false
