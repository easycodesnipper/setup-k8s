---
# playbook-reset.yml

- name: Reset Kubernetes Cluster & Network Stack
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Confirm Kubernetes cluster reset
      block:
        - name: Multi-stage Cluster Reset Confirmation
          ansible.builtin.pause:
            prompt: |
              [ CONFIRMATION STEP {{ item }} of 3 ]
              #########################################################
              ###          !!!  FINAL WARNING  !!!                  ###
              ###  Type 'y' to continue, any other key to abort.    ###
              #########################################################
          register: current_pause
          loop: "{{ range(1, 4) | list }}"
          loop_control:
            break_when: "current_pause.user_input | lower != 'y'"
          run_once: true # noqa: run-once[task]
          delegate_to: localhost

        - name: Abort if without full confirmation
          ansible.builtin.meta: end_play
          when: "current_pause.results | last | attr('user_input') | default('') | lower != 'y'"

      when:
        - not ansible_check_mode
        - k8s_reset_need_confirm | default(true) | bool

    - name: 1. Core Kubeadm Reset
      ansible.builtin.command: kubeadm reset -f
      changed_when: true
      register: reset_result
      failed_when:
        - reset_result.rc != 0
        - '"does not exist" not in reset_result.stderr'
        - '"not found" not in reset_result.stderr'

    - name: 2. Stop Network-Related Services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: ["kubelet", "containerd"]
      failed_when: false

    - name: 3. Deep Clean Directories & Binaries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /opt/cni/bin/cilium-cni
        - /var/run/cilium
        - /var/run/calico
        - /var/lib/cni/
        - /var/lib/calico/
        - /etc/kubernetes
        - /var/lib/kubelet
        - /var/lib/etcd
        - "{{ ansible_facts['env']['HOME'] }}/.kube"
      failed_when: false

    - name: 4. Purge All Network Interfaces (Bridges & Tunnels)
      ansible.builtin.shell: |
        set -o pipefail
        # Flannel
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        # Calico / Generic Tun
        ip link delete tunl0 || true
        # Cilium
        ip link delete cilium_host || true
        ip link delete cilium_net || true
        ip link delete cilium_vxlan || true
        # Clean up any remaining veth pairs
        ip link show | grep veth | awk '{print $2}' | cut -d'@' -f1 | xargs -r -L1 ip link delete || true
        # Delete all Calico-specific veth interfaces
        ip link show | grep -E 'cali|tunl0|vxlan.calico' | awk '{print $2}' | cut -d'@' -f1 | sed 's/://g' | xargs -r -L1 ip link delete || true
      args:
        executable: /bin/bash
      changed_when: true

    - name: 5. Flush Routing Table (Remove Proto Bird / Stale Routes)
      ansible.builtin.shell: |
        set -o pipefail
        # Specifically target routes added by Calico (Bird) or Cilium
        ip route show proto bird | awk '{print "ip route del " $1}' | sh || true
        ip route show | grep "blackhole" | awk '{print "ip route del " $2}' | sh || true
      args:
        executable: /bin/bash
      changed_when: true

    - name: 6. Reset Iptables & IPVS
      ansible.builtin.shell: |
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -t raw -F
        iptables -X && iptables -t nat -X && iptables -t mangle -X && iptables -t raw -X
        if command -v ipvsadm >/dev/null; then ipvsadm --clear; fi
      changed_when: true

    - name: 7. Clear BPF File System
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep "/sys/fs/bpf" | awk '{print $3}' | xargs -r umount || true
        rm -rf /sys/fs/bpf/* || true
      args:
        executable: /bin/bash
      changed_when: true

    - name: 8. Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
