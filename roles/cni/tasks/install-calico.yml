---
- name: Install Calico network plugin
  ansible.builtin.command: kubectl apply -f {{ k8s_calico_manifest_file }}
  register: calico_result
  until: calico_result.rc == 0
  retries: 3
  delay: 15
  changed_when: calico_result.rc == 0

- name: Patch CALICO_IPV4POOL_CIDR
  ansible.builtin.command: |
    kubectl patch daemonset calico-node -n kube-system --type='strategic' -p='
    spec:
      template:
        spec:
          containers:
          - name: calico-node
            env:
            - name: CALICO_IPV4POOL_CIDR
              value: "{{ k8s_pod_network_cidr | default('10.244.0.0/16') }}"
    '
  changed_when: true
