---
# roles/containerd/tasks/configure.yml

- name: "Containerd | Check configuration state"
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_file }}"
    line: "SystemdCgroup = true"
    state: present
  check_mode: yes
  register: cgroup_check
  failed_when: false

- name: Generate default containerd config if missing or SystemdCgroup not true
  become: true
  block:
    - name: Ensure containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate current default containerd configuration
      ansible.builtin.shell:
        cmd: containerd config default
      register: containerd_default_config
      changed_when: false
      check_mode: false

    - name: Write default config (backup existing if present)
      ansible.builtin.copy:
        content: "{{ containerd_default_config.stdout }}\n"
        dest: "{{ containerd_config_file }}"
        backup: true
      notify: Restart containerd

    - name: Ensure SystemdCgroup is set to true (preserve indentation, uncomment if needed)
      ansible.builtin.lineinfile:
        path: "{{ containerd_config_file }}"
        regexp: '^( *)?#?\s*(SystemdCgroup = ).*'
        line: '\1\2true'
        backrefs: true
      notify: Restart containerd
  when: >
    (not cgroup_check.found | default(false)) 
    or
    cgroup_check.changed
