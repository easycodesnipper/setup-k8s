---
# roles/containerd/tasks/configure.yml

- name: "Containerd | Check if SystemdCgroup present"
  ansible.builtin.command:
    cmd: grep -q '^\s*SystemdCgroup\s*=\s*true\s*$' "{{ containerd_config_file }}"
  register: cgroup_check
  failed_when: false
  changed_when: false

- name: Generate default containerd config if missing or SystemdCgroup not true
  become: true
  when: cgroup_check.rc != 0

  block:
    - name: Ensure containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate current default containerd configuration
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_default_config
      changed_when: false
      check_mode: false

    - name: Write default config (backup existing if present)
      ansible.builtin.copy:
        content: "{{ containerd_default_config.stdout }}\n"
        dest: "{{ containerd_config_file }}"
        mode: "0644"
        backup: true
      notify: Restart containerd

    - name: Ensure SystemdCgroup is set to true (preserve indentation, uncomment if needed)
      ansible.builtin.lineinfile:
        path: "{{ containerd_config_file }}"
        regexp: "^( *)?#?\\s*(SystemdCgroup = ).*"
        line: "\\1\\2true"
        backrefs: true
      notify: Restart containerd
- name: Enable/Disable containerd debugging
  block:
    - name: Ensure debug section exists in containerd config
      ansible.builtin.lineinfile:
        path: "{{ containerd_config_file }}"
        line: "[debug]"
        insertafter: EOF
        state: present
      notify: Restart containerd

    - name: Set containerd debug level
      ansible.builtin.lineinfile:
        path: "{{ containerd_config_file }}"
        regexp: "^\\s*level\\s*=\\s*.*"
        line: "  level = '{{ 'debug' if (containerd_debug | default(false)) | bool else 'info' }}'"
        insertafter: "^\\[debug\\]$"
        backup: true
      notify: Restart containerd
