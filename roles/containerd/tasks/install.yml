---
# roles/containerd/tasks/install.yml

- name: Check if containerd config exists
  ansible.builtin.stat:
    path: "{{ containerd_config_file }}"
  register: containerd_conf_stat

- name: Install containerd if not running or not configured
  when: >
    not containerd_conf_stat.stat.exists
  block:
    - name: Gather facts
      ansible.builtin.setup:
      when: ansible_facts["os_family"] is not defined

    - name: Install required packages
      ansible.builtin.package:
        name: "{{ containerd_required_packages[ansible_facts['os_family']] }}"
        state: present
        update_cache: true

    - name: Setup Docker repository
      ansible.builtin.include_tasks:
        file: setup-repo-{{ ansible_facts["os_family"] | lower }}.yml

    - name: Install containerd
      ansible.builtin.package:
        name: containerd.io
        state: present
      retries: 5
      delay: 15
      register: result
      until: result is succeeded

    - name: Install crictl
      ansible.builtin.include_tasks:
        file: crictl.yml
