# setup-repo-debian.yml
---
- name: Check if Docker repository file exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/docker.sources
  register: docker_repo_file

- name: Setup Docker repository
  when: not docker_repo_file.stat.exists
  block:
    - name: Ensure apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Get system architecture (dpkg format)
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      check_mode: false

    - name: Construct Docker GPG key URL
      ansible.builtin.set_fact:
        docker_gpg_url: "{{ docker_repo_base_url | default('https://download.docker.com') }}/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

    # - name: Debug Docker GPG key URL
    #   ansible.builtin.debug:
    #     var: docker_gpg_url

    - name: Download Docker GPG key (ASCII armored)
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL "{{ docker_gpg_url }}" -o "{{ docker_gpg_keyrings }}"
        chmod a+r {{ docker_gpg_keyrings }}
      args:
        creates: "{{ docker_gpg_keyrings }}"
        executable: /bin/bash
      register: gpg_download
      until: gpg_download is success
      retries: 5
      delay: 15

    - name: Add Docker repository (deb822 format)
      ansible.builtin.blockinfile:
        path: /etc/apt/sources.list.d/docker.sources
        block: |
          Types: deb
          URIs: {{ docker_repo_base_url | default('https://download.docker.com') }}/linux/{{ ansible_facts['distribution'] | lower }}
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ dpkg_arch.stdout }}
          Signed-By: {{ docker_gpg_keyrings }}
        marker: "# {mark} DOCKER REPO CONFIGURATION"
        create: true
        mode: "0644"
        backup: true
      register: repo_change

    - name: Update apt cache if GPG key or repository changed
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
      when: gpg_download is changed or repo_change is changed
