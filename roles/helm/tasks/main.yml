---
# roles/helm/tasks/main.yml
- name: Gather facts
  ansible.builtin.setup:
  when: ansible_facts["system"] is not defined

- name: Check if Helm is already installed with correct version
  ansible.builtin.command: helm version --short
  register: helm_version_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set Helm version fact
  ansible.builtin.set_fact:
    installed_helm_version: "{{ helm_version_check.stdout | regex_replace('^v(.*)$', '\\1') }}"
  when: helm_version_check.stdout != ""

- name: Download and install Helm
  become: true
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-v{{ helm_version }}-{{ helm_platform }}-{{ helm_architecture }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    extra_opts:
      - --strip-components=1
  args:
    creates: "/usr/local/bin/helm"
  retries: 5
  delay: 15
  when: installed_helm_version is not defined or installed_helm_version != helm_version

