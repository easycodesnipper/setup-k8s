---
- name: Check if Kubernetes cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_initialized
  failed_when: false

- name: Initialize Kubernetes cluster if not already done
  when: not kubeadm_initialized.stat.exists
  block:
    - name: Pull Kubernetes images using kubeadm
      ansible.builtin.command:
        cmd: >-
          kubeadm config images pull
          --kubernetes-version={{ k8s_version }} --v={{ k8s_verbosity | default(2) }}
          {% if k8s_config_image_repository is defined and k8s_config_image_repository %}
          --image-repository={{ k8s_config_image_repository }}
          {% endif %}
      register: pull_result
      changed_when: "'Image pull finished' in pull_result.stdout"
      retries: 30
      delay: 10
      until: pull_result is success

    - name: Generate kubeadm init configuration from template
      ansible.builtin.template:
        src: kubeadm-config.yaml.j2
        dest: /tmp/kubeadm-config.yaml
        mode: "0644"

    - name: Initialize Kubernetes cluster with config file
      ansible.builtin.shell: >
        kubeadm init
        --config=/tmp/kubeadm-config.yaml
        --v={{ k8s_verbosity | default(2) }}
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/admin.conf # Skip if already initialized
      register: kubeadm_init
      changed_when: kubeadm_init.rc == 0
      failed_when:
        - kubeadm_init.rc != 0
        - '"cluster already exists" not in kubeadm_init.stderr'

- name: Ensure home directory exists for kube config
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: kubeadm_initialized.stat.exists or not ansible_check_mode

- name: Create .kube directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: kubeadm_initialized.stat.exists or not ansible_check_mode

- name: Copy admin config to user home
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: kubeadm_initialized.stat.exists or not ansible_check_mode
