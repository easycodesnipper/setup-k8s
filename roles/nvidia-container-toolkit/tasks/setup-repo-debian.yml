---
# roles/nvidia-container-toolkit/tasks/setup-repo-debian.yml

- name: Check if NVIDIA Container Toolkit repository file exists and is not empty
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
  register: nct_repo_file

- name: Setup NVIDIA Container Toolkit repository
  when: not nct_repo_file.stat.exists or nct_repo_file.stat.size == 0
  block:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Set repository base URL based on mirror preference
      ansible.builtin.set_fact:
        nct_repo_base_url: "{{ nct_repo_url_mirror if nct_use_mirror | bool else nct_repo_url_official }}"

    - name: Download NVIDIA Container Toolkit GPG key
      ansible.builtin.get_url:
        url: "{{ nct_repo_base_url }}/gpgkey"
        dest: /tmp/nvidia-container-toolkit-key.asc
        mode: '0644'
      register: gpg_key_download
      until: gpg_key_download is success
      retries: 5
      delay: 15

    - name: Convert GPG key to binary format
      ansible.builtin.command:
        cmd: "gpg --yes --dearmor -o {{ nct_gpg_keyring }} /tmp/nvidia-container-toolkit-key.asc"
        creates: "{{ nct_gpg_keyring }}"

    - name: Clean up temporary GPG key file
      ansible.builtin.file:
        path: "/tmp/nvidia-container-toolkit-key.asc"
        state: absent

    - name: Download NVIDIA Container Toolkit repository list
      ansible.builtin.get_url:
        url: "{{ nct_repo_base_url }}/stable/deb/nvidia-container-toolkit.list"
        dest: /tmp/nvidia-container-toolkit.list
        mode: '0644'
      register: repo_list_download
      until: repo_list_download is success
      retries: 5
      delay: 15

    - name: Add signed-by attribute and configure repository with correct base URL
      ansible.builtin.shell: |
        sed 's#https://nvidia.github.io/libnvidia-container#{{ nct_repo_base_url }}#g' /tmp/nvidia-container-toolkit.list | \
        sed 's#deb https://#deb [signed-by={{ nct_gpg_keyring }}] https://#g' | \
        tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        executable: /bin/bash
      register: repo_install

    - name: Clean up temporary repository list file
      ansible.builtin.file:
        path: "/tmp/nvidia-container-toolkit.list"
        state: absent

- name: Update apt cache to include NVIDIA Container Toolkit repository
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
    cache_valid_time: 0
