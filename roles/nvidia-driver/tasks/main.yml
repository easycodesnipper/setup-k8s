---
# roles/nvidia-driver/tasks/main.yml

- name: Install NVIDIA GPU Driver on {{ node_item }}
  delegate_to: "{{ node_item }}"
  become: true
  when: nvidia_driver_enabled | bool
  block:
    - name: Ensure required facts are available
      ansible.builtin.setup:
      when: ansible_facts is not defined or ansible_facts.get('os_family', '') == ''

    - name: Detect NVIDIA GPU hardware
      ansible.builtin.shell: |
        if lspci 2>/dev/null | grep -i nvidia > /dev/null; then
          gpu_info=$(lspci | grep -i nvidia | head -1)
          echo "GPU_DETECTED: $gpu_info"
          exit 0
        else
          echo "NO_GPU_DETECTED"
          exit 1
        fi
      register: gpu_detection
      changed_when: false
      failed_when: false

    - name: Set GPU detection fact
      ansible.builtin.set_fact:
        gpu_detected: "{{ 'GPU_DETECTED' in gpu_detection.stdout }}"
        gpu_info: "{{ gpu_detection.stdout | regex_replace('GPU_DETECTED: ', '') }}"

    - name: Display GPU detection status
      ansible.builtin.debug:
        msg: |
          {% if gpu_detected | bool %}
          ✅ NVIDIA GPU detected: {{ gpu_info }}
          Proceeding with driver installation...
          {% else %}
          ⚠️  No NVIDIA GPU detected on this host
          
          Skipping NVIDIA driver installation.
          If this is a GPU node, please verify:
            • GPU hardware is properly installed
            • VFIO/GPU passthrough is correctly configured (for VMs)
            • BIOS/UEFI settings allow GPU detection
          {% endif %}

    - name: Check if NVIDIA driver is properly loaded
      ansible.builtin.shell: |
        # Check if nvidia-smi command exists AND can communicate with driver
        if command -v nvidia-smi &> /dev/null && nvidia-smi > /dev/null 2>&1; then
          driver_version=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader,nounits | head -1)
          echo "DRIVER_LOADED: $driver_version"
        # Check if driver package is installed but module not loaded
        elif dpkg -l | grep -q "nvidia-driver"; then
          echo "DRIVER_INSTALLED_NOT_LOADED"
        else
          echo "DRIVER_NOT_INSTALLED"
        fi
      register: driver_check
      changed_when: false
      failed_when: false

    - name: Set driver installation status
      ansible.builtin.set_fact:
        driver_loaded: "{{ 'DRIVER_LOADED' in (driver_check.stdout | default('')) }}"
        driver_installed_not_loaded: "{{ 'DRIVER_INSTALLED_NOT_LOADED' in (driver_check.stdout | default('')) }}"
        driver_not_installed: "{{ 'DRIVER_NOT_INSTALLED' in (driver_check.stdout | default('')) }}"
        current_driver_version: "{{ (driver_check.stdout | default('')) | regex_replace('DRIVER_LOADED: ', '') }}"

    - name: Display current driver status
      ansible.builtin.debug:
        msg: |
          {% if driver_loaded | bool %}
          ✅ NVIDIA driver is loaded and working: {{ current_driver_version }}
          Skipping installation.
          {% elif driver_installed_not_loaded | bool %}
          ⚠️  NVIDIA driver package is installed but module is NOT loaded
          This usually means:
            • System needs reboot after driver installation
            • Kernel version mismatch (driver built for different kernel)
          Will attempt to reload modules or trigger reboot.
          {% else %}
          ℹ️  NVIDIA driver not installed
          Proceeding with installation using method: {{ nvidia_driver_install_method }}
          {% endif %}

    - name: Handle driver installed but not loaded scenario
      when: driver_installed_not_loaded | bool
      block:
        - name: Check current kernel version
          ansible.builtin.command: uname -r
          register: current_kernel
          changed_when: false

        - name: Check installed NVIDIA kernel modules
          ansible.builtin.shell: |
            dpkg -l | grep linux-modules-nvidia | awk '{print $2}'
          register: installed_modules
          changed_when: false
          failed_when: false

        - name: Display kernel version mismatch
          ansible.builtin.debug:
            msg: |
              Current running kernel: {{ current_kernel.stdout }}
              Installed NVIDIA modules:
              {{ installed_modules.stdout }}
              
              If versions don't match, a reboot is required.

        - name: Attempt to load NVIDIA kernel modules
          ansible.builtin.shell: |
            modprobe nvidia 2>&1 || true
            modprobe nvidia-uvm 2>&1 || true
          register: modprobe_result
          changed_when: false
          failed_when: false

        - name: Verify if module loading succeeded
          ansible.builtin.shell: nvidia-smi > /dev/null 2>&1
          register: smi_after_modprobe
          changed_when: false
          failed_when: false

        - name: Trigger reboot if modules still not loaded
          when: smi_after_modprobe.rc != 0 and nvidia_driver_reboot | bool
          block:
            - name: Reboot the system to load new kernel
              ansible.builtin.reboot:
                reboot_timeout: "{{ nvidia_driver_reboot_timeout }}"
                test_command: "command -v nvidia-smi && nvidia-smi > /dev/null"
              register: reboot_result

            - name: Display reboot completion
              ansible.builtin.debug:
                msg: "✅ System rebooted. NVIDIA driver should now be active."

    - name: Install NVIDIA driver based on selected method
      when: driver_not_installed | bool and (gpu_detected | bool)
      block:
        - name: Install via ubuntu-drivers autoinstall (Ubuntu/Debian)
          ansible.builtin.include_tasks: install-ubuntu.yml
          when: 
            - ansible_facts['os_family'] == 'Debian'
            - nvidia_driver_install_method == 'autoinstall'

        - name: Install specific driver version (Ubuntu/Debian)
          ansible.builtin.include_tasks: install-specific-version.yml
          when:
            - ansible_facts['os_family'] == 'Debian'
            - nvidia_driver_install_method == 'specific_version'

        - name: Fail if unsupported OS or method
          ansible.builtin.fail:
            msg: |
              Unsupported configuration:
                OS Family: {{ ansible_facts['os_family'] }}
                Install Method: {{ nvidia_driver_install_method }}
              
              Currently supported:
                - Ubuntu/Debian with autoinstall method
                - Ubuntu/Debian with specific_version method
          when: >
            (ansible_facts['os_family'] != 'Debian') or
            (nvidia_driver_install_method not in ['autoinstall', 'specific_version'])

    - name: Verify driver installation
      when: gpu_detected | bool
      block:
        - name: Wait for nvidia-smi to become available
          ansible.builtin.shell: nvidia-smi > /dev/null 2>&1
          register: smi_check
          retries: 10
          delay: 5
          until: smi_check.rc == 0
          changed_when: false
          failed_when: false

        - name: Get installed driver information
          ansible.builtin.shell: |
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          register: driver_info
          changed_when: false
          failed_when: false

        - name: Display driver installation result
          ansible.builtin.debug:
            msg: |
              ✅ NVIDIA driver installation completed successfully!
              
              {{ driver_info.stdout }}

    - name: Reboot system if required after installation
      when: 
        - nvidia_driver_reboot | bool
        - gpu_detected | bool
        - driver_not_installed | bool or driver_installed_not_loaded | bool
      block:
        - name: Check if reboot is actually needed
          ansible.builtin.shell: |
            # If nvidia-smi works, no reboot needed
            if nvidia-smi > /dev/null 2>&1; then
              echo "NO_REBOOT_NEEDED"
            else
              echo "REBOOT_NEEDED"
            fi
          register: final_reboot_check
          changed_when: false
          failed_when: false

        - name: Reboot the system if necessary
          when: "'REBOOT_NEEDED' in final_reboot_check.stdout"
          ansible.builtin.reboot:
            reboot_timeout: "{{ nvidia_driver_reboot_timeout }}"
            test_command: "command -v nvidia-smi && nvidia-smi > /dev/null"
          register: reboot_result

        - name: Display reboot status
          when: "'REBOOT_NEEDED' in final_reboot_check.stdout"
          ansible.builtin.debug:
            msg: "✅ System rebooted successfully. NVIDIA driver should be active."

        - name: Skip reboot (driver already working)
          when: "'NO_REBOOT_NEEDED' in final_reboot_check.stdout"
          ansible.builtin.debug:
            msg: "ℹ️  Reboot skipped - NVIDIA driver is already working properly."
