---
# roles/plugin/defaults/main.yml

# Safe proxy for GitHub manifests (ensures trailing slash)
k8s_plugin_manifest_proxy_safe: "{{ (k8s_plugin_manifest_proxy | default('')) | regex_replace('([^/])$', '\\1/') }}"

k8s_plugins:
  ################################### cni-flannel ###################################
  # Description: 🌐 Simple and lightweight CNI plugin that provides an overlay network.
  # Helm: N/A (Manifest-based)
  # Kubectl: kubectl get ds -n kube-system -l k8s-app=flannel
  #          kubectl logs -n kube-system -l k8s-app=flannel
  cni-flannel:
    enabled: "{{ k8s_plugin_flannel_enabled | default(false) | bool }}"
    namespace: "kube-system"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://github.com/flannel-io/flannel/releases/download/v{{ k8s_plugin_flannel_version | default('0.27.4') }}/kube-flannel.yml"
    wait:
      labels: "k8s-app=flannel"

  ################################### cni-calico ###################################
  # Description: 🌐 High-performance CNI plugin with network policy and advanced routing.
  # Helm: N/A (Manifest-based)
  # Kubectl: kubectl get ds -n kube-system -l k8s-app=calico
  #          kubectl logs -n kube-system -l k8s-app=calico
  cni-calico:
    enabled: "{{ k8s_plugin_calico_enabled | default(false) | bool }}"
    namespace: "kube-system"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://raw.githubusercontent.com/projectcalico/calico/v{{ k8s_plugin_calico_version | default('3.31.1') }}/manifests/calico.yaml"
    patch:
      type: strategic
      resource: "daemonset/calico-node"
      data:
        spec:
          template:
            spec:
              containers:
                - name: calico-node
                  env:
                    - name: CALICO_IPV4POOL_CIDR
                      value: "{{ k8s_pod_subnet | default('10.244.0.0/16') }}"
    wait:
      labels: "k8s-app=calico"

  ################################### cni-cilium ###################################
  # Description: 🌐 Networking, observability, and security with the power of eBPF.
  # Helm: helm repo add cilium https://helm.cilium.io
  #       helm search repo cilium/cilium --versions | head -n 4
  #       helm show values cilium/cilium --version 1.19.0 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install cilium cilium/cilium -n cilium-system
  # Kubectl: kubectl exec -it -n cilium-system ds/cilium -- cilium status
  #          kubectl exec -it -n cilium-system ds/cilium -- cilium connectivity test
  cni-cilium:
    enabled: "{{ k8s_plugin_cilium_enabled | default(false) | bool }}"
    namespace: "{{ k8s_plugin_cilium_namespace | default('cilium-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_cilium_helm_repo_name | default('cilium') }}"
        url: "{{ k8s_plugin_cilium_helm_repo_url | default('https://helm.cilium.io') }}"
      release: "cilium"
      chart: "cilium/cilium"
      version: "{{ k8s_plugin_cilium_version | default('1.19.0') }}"
      values:
        operator:
          replicas: "{{ k8s_cilium_operator_replicas | default(2) | int }}"
        kubeProxyReplacement: "{{ k8s_cilium_kubeproxy_replacement | default(true) | bool }}"
        hubble:
          enabled: "{{ k8s_cilium_hubble_enabled | default(false) | bool }}"
          relay:
            enabled: "{{ k8s_cilium_hubble_relay_enabled | default(false) | bool }}"
          ui:
            enabled: "{{ k8s_cilium_hubble_ui_enabled | default(false) | bool }}"
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList:
              - "{{ k8s_pod_subnet | default('10.244.0.0/16') }}"
    wait:
      labels: "k8s-app=cilium"

  ################################### nvidia-device-plugin ###################################
  # Description: 🖥️ Exposes NVIDIA GPU resources to Kubernetes pods.
  # Helm: helm repo add nvdp https://nvidia.github.io/k8s-device-plugin
  #       helm search repo nvdp/nvidia-device-plugin --versions | head -n 4
  #       helm show values nvdp/nvidia-device-plugin --version 0.19.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install nvdp nvdp/nvidia-device-plugin -n nvidia-device-plugin
  # Kubectl: kubectl get ds -n nvidia-device-plugin
  #          kubectl logs -n nvidia-device-plugin -l app.kubernetes.io/name=nvidia-device-plugin
  nvidia-device-plugin:
    enabled: "{{ k8s_plugin_nvidia_device_plugin_enabled | default(false) | bool }}"
    namespace: "{{ k8s_plugin_nvidia_device_plugin_namespace | default('nvidia-device-plugin') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_nvidia_device_plugin_helm_repo_name | default('nvdp') }}"
        url: "{{ k8s_plugin_nvidia_device_plugin_helm_repo_url | default('https://nvidia.github.io/k8s-device-plugin') }}"
      release: "{{ k8s_plugin_nvidia_device_plugin_helm_release | default('nvdp') }}"
      chart: "{{ k8s_plugin_nvidia_device_plugin_helm_chart | default('nvdp/nvidia-device-plugin') }}"
      version: "{{ k8s_plugin_nvidia_device_plugin_version | default('0.19.1') }}"
    wait:
      resource: "daemonset/nvdp-nvidia-device-plugin"
      labels: "app.kubernetes.io/name=nvidia-device-plugin"
      condition: "Ready"
      timeout: "5m"

  ################################### metallb ###################################
  # Description: 🌐 Load-balancer for bare-metal Kubernetes.
  # Helm: N/A (Manifest-based)
  # Kubectl: kubectl get ipaddresspool -n metallb-system
  #          kubectl get events -n metallb-system
  metallb:
    enabled: "{{ k8s_plugin_metallb_enabled | default(true) | bool }}"
    namespace: "{{ k8s_plugin_metallb_namespace | default('metallb-system') }}"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://raw.githubusercontent.com/metallb/metallb/v{{ k8s_plugin_metallb_version | default('0.15.3') }}/config/manifests/metallb-native.yaml"
    wait:
      resource: "deployment/controller"
      labels: ""
      condition: "available"
      timeout: "5m"

  ################################### traefik ###################################
  # Description: 🌐 Cloud-native Ingress Controller.
  # Helm: helm repo add traefik https://traefik.github.io/charts
  #       helm search repo traefik/traefik --versions | head -n 4
  #       helm show values traefik/traefik --version 39.0.7 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install traefik traefik/traefik -n traefik-system
  # Kubectl: kubectl get ingress -A
  #          kubectl get pods -n traefik-system
  traefik:
    enabled: "{{ k8s_plugin_traefik_enabled | default(true) | bool }}"
    namespace: "{{ k8s_plugin_traefik_namespace | default('traefik-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_traefik_helm_repo_name | default('traefik') }}"
        url: "{{ k8s_plugin_traefik_helm_repo_url | default('https://traefik.github.io/charts') }}"
      release: "traefik"
      chart: "traefik/traefik"
      version: "{{ k8s_plugin_traefik_version | default('39.0.7') }}"
    wait:
      labels: "app.kubernetes.io/instance=traefik"
    ingress:
      enabled: true

  ################################### longhorn ###################################
  # Description: 💾 Distributed block storage.
  # Helm: helm repo add longhorn https://charts.longhorn.io
  #       helm search repo longhorn/longhorn --versions | head -n 4
  #       helm show values longhorn/longhorn --version 1.11.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install longhorn longhorn/longhorn -n longhorn-system
  # Kubectl: kubectl get nodes -l longhorn.io/node-role=manager
  #          kubectl get volumes.longhorn.io -n longhorn-system
  longhorn:
    enabled: "{{ k8s_plugin_longhorn_enabled | default(true) | bool }}"
    depends_on: ["traefik"]
    namespace: "{{ k8s_plugin_longhorn_namespace | default('longhorn-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_longhorn_helm_repo_name | default('longhorn') }}"
        url: "{{ k8s_plugin_longhorn_helm_repo_url | default('https://charts.longhorn.io') }}"
      release: "longhorn"
      chart: "longhorn/longhorn"
      version: "{{ k8s_plugin_longhorn_version | default('1.11.1') }}"
    wait:
      labels: "app.kubernetes.io/instance=longhorn"
    ingress:
      tls:
        enabled: "{{ k8s_plugin_longhorn_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_longhorn_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"

  ################################### harbor ###################################
  # Description: 🐳 Cloud-native registry.
  # Helm: helm repo add goharbor https://helm.goharbor.io
  #       helm search repo goharbor/harbor --versions | head -n 4
  #       helm show values goharbor/harbor --version 1.18.3 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install harbor goharbor/harbor -n harbor-system
  # Kubectl: kubectl logs -n harbor-system -l component=core
  #          kubectl get secret harbor-admin-password -n harbor-system -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d
  harbor:
    enabled: "{{ k8s_plugin_harbor_enabled | default(true) | bool }}"
    depends_on: ["traefik", "longhorn"]
    namespace: "{{ k8s_plugin_harbor_namespace | default('harbor-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_harbor_helm_repo_name | default('goharbor') }}"
        url: "{{ k8s_plugin_harbor_helm_repo_url | default('https://helm.goharbor.io') }}"
      release: "{{ k8s_plugin_harbor_helm_release | default('harbor') }}"
      chart: "{{ k8s_plugin_harbor_helm_chart | default('goharbor/harbor') }}"
      version: "{{ k8s_plugin_harbor_version | default('1.18.3') }}"
    wait:
      labels: "app=harbor"
    ingress:
      tls:
        enabled: "{{ k8s_plugin_harbor_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_harbor_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"

  ################################### gitlab ###################################
  # Description: 🚀 DevOps platform (repos, CI/CD).
  # Helm: helm repo add gitlab-jh https://charts.gitlab.cn
  #       helm search repo gitlab-jh/gitlab --versions | head -n 4
  #       helm show values gitlab-jh/gitlab --version 9.11.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install gitlab gitlab-jh/gitlab -n gitlab-system
  # Kubectl: kubectl get pods -n gitlab-system -l release=gitlab
  #          kubectl get secret gitlab-gitlab-initial-root-password -n gitlab-system -o jsonpath='{.data.password}' | base64 -d
  gitlab:
    enabled: "{{ k8s_plugin_gitlab_enabled | default(true) }}"
    depends_on: ["traefik", "longhorn"]
    namespace: "{{ k8s_plugin_gitlab_namespace | default('gitlab-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_gitlab_helm_repo_name | default('gitlab-jh') }}"
        url: "{{ k8s_plugin_gitlab_helm_repo_url | default('https://charts.gitlab.cn') }}"
      release: "{{ k8s_plugin_gitlab_helm_release | default('gitlab') }}"
      chart: "{{ k8s_plugin_gitlab_helm_chart | default('gitlab-jh/gitlab') }}"
      version: "{{ k8s_plugin_gitlab_version | default('9.11.1') }}"
    wait:
      labels: "app=webservice"

  ################################### openproject ###################################
  # Description: 📊 Open-source project management software.
  # Helm: helm repo add openproject https://charts.openproject.org
  #       helm search repo openproject/openproject --versions | head -n 4
  #       helm show values openproject/openproject --version 13.5.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  #       helm upgrade --install op openproject/openproject -n openproject-system
  # Kubectl: kubectl describe deploy openproject -n openproject-system
  #          kubectl logs -n openproject-system -l app=openproject
  openproject:
    enabled: "{{ k8s_plugin_openproject_enabled | default(true) }}"
    depends_on: ["traefik", "longhorn"]
    namespace: "{{ k8s_plugin_openproject_namespace | default('openproject-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_openproject_helm_repo_name | default('openproject') }}"
        url: "{{ k8s_plugin_openproject_helm_repo_url | default('https://charts.openproject.org') }}"
      release: "{{ k8s_plugin_openproject_helm_release | default('openproject') }}"
      chart: "{{ k8s_plugin_openproject_helm_chart | default('openproject/openproject') }}"
      version: "{{ k8s_plugin_openproject_version | default('13.5.1') }}"
    wait:
      labels: "app=openproject"
