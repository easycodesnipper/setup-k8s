# roles/plugin/defaults/main.yml
---
k8s_plugins:
################################### cni-flannel ###################################
  # CNI - flannel
  cni-flannel:
    namespace: "kube-system"
    manifest: "https://github.com/flannel-io/flannel/releases/download/v{{ k8s_plugin_flannel_version | default('0.27.4') }}/kube-flannel.yml"
    wait:
      labels: "k8s-app=flannel"

################################### cni-calico ###################################
  # CNI - calico
  cni-calico:
    namespace: "kube-system"
    manifest: "https://raw.githubusercontent.com/projectcalico/calico/v{{ k8s_plugin_calico_version | default('3.31.1') }}/manifests/calico.yaml"
    patch: # how to validate: kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.containers[0].env[] | select(.name=="CALICO_IPV4POOL_CIDR")'
      type: strategic
      resource: "daemonset/calico-node"
      data:
        spec:
          template:
            spec:
              containers:
              - name: calico-node
                env:
                - name: CALICO_IPV4POOL_CIDR
                  value: "{{ k8s_pod_network_cidr | default('10.244.0.0/16') }}"
    wait:
      labels: "k8s-app=calico"

################################### cni-cilium ###################################
  # CNI - cilium
  cni-cilium:
    namespace: "{{ k8s_plugin_cilium_namespace | default('cilium-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_cilium_helm_repo_name | default('cilium') }}"
        url: "{{ k8s_plugin_cilium_helm_repo_url | default('https://helm.cilium.io') }}"
      release: "cilium"
      chart: "cilium/cilium"
      version: "{{ k8s_plugin_cilium_version | default('1.19.0') }}" # helm search repo cilium/cilium --versions
      values:
        operator:
          replicas: "{{ k8s_cilium_operator_replicas | default(2) | int }}"
        kubeProxyReplacement: "{{ k8s_cilium_kubeproxy_replacement | default(true) | bool }}"
        hubble:
          enabled: "{{ k8s_cilium_hubble_enabled | default(false) | bool }}"
          relay:
            enabled: "{{ k8s_cilium_hubble_relay_enabled | default(false) | bool }}"
          ui:
            enabled: "{{ k8s_cilium_hubble_ui_enabled | default(false) | bool }}"
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList:
              - "{{ k8s_pod_network_cidr | default('10.244.0.0/16') }}"
    wait:
      labels: "k8s-app=cilium"

################################### metallb ###################################
  # MetalLB to provide load balancer
  metallb:
    enabled: "{{ k8s_plugin_metallb_enabled | default(true) | bool }}"
    namespace: "metallb-system"
    manifest: "https://raw.githubusercontent.com/metallb/metallb/v\
      {{ k8s_plugin_metallb_version | default('0.15.3') }}\
      /config/manifests/metallb-native.yaml"
    wait:
      labels: "app=metallb"
    configuration:
      data: |
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: metallb-system
        spec:
          addresses: {{ k8s_plugin_metallb_ip_range | default(['10.17.3.200-10.17.3.249']) }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default-l2-advertisement
          namespace: metallb-system
        spec:
          ipAddressPools:
          - default-pool

################################### metrics-server ###################################
  # Metrics Server to collect metrics(CPU, Memory, ...)
  metrics-server:
    enabled: "{{ k8s_plugin_metrics_server_enabled | default(true) | bool }}"
    namespace: "kube-system"
    manifest: "https://github.com/kubernetes-sigs/metrics-server/releases/download/v{{ k8s_plugin_metrics_server_version | default('0.8.1') }}/components.yaml"
    patch: # how to validate: kubectl get deployment metrics-server -n kube-system -o json | jq '.spec.template.spec.containers[0].args'
      type: json
      resource: "deployment/metrics-server"
      data:
        [
          {
            "op": "add",
            "path": "/spec/template/spec/containers/0/args/-",
            "value": "--kubelet-insecure-tls"
          }
        ]
    wait:
      labels: "k8s-app=metrics-server"

################################### local-path-provisioner ###################################
  # Local Path Provisioner to provision local storage
  local-path-provisioner:
    enabled: "{{ k8s_plugin_local_path_provisioner_enabled | default(false) | bool }}"
    namespace: "local-path-storage"
    manifest: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v{{ k8s_plugin_local_path_provisioner_version | default('0.0.35') }}/deploy/local-path-storage.yaml"
    patch: # how to validate: kubectl get configmap local-path-config -n local-path-storage -o json | jq '.data["config.json"] | fromjson'
      type: json
      resource: "configmap/local-path-config"
      data:
        [
          {
            "op": "replace",
            "path": "/data/config.json",
            "value": "{{ {'nodePathMap': [{'node': 'DEFAULT_PATH_FOR_NON_LISTED_NODES', 'paths': [k8s_plugin_local_path_provisioner_default_path | default('/var/local/rancher/local-path')]}]} | to_json }}"
          }
        ]
    wait:
      labels: "app=local-path-provisioner"

################################### longhorn ###################################
  # Provide distributed block storage
  longhorn:
    enabled: "{{ k8s_plugin_longhorn_enabled | default(true) | bool }}"
    namespace: "{{ k8s_plugin_longhorn_namespace | default('longhorn-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_longhorn_helm_repo_name | default('longhorn') }}"
        url: "{{ k8s_plugin_longhorn_helm_repo_url | default('https://charts.longhorn.io') }}"
      release: "longhorn"
      chart: "longhorn/longhorn"
      version: "{{ k8s_plugin_longhorn_version | default('1.11.1') }}" # helm search repo longhorn/longhorn --versions
      values: # helm show values longhorn/longhorn | sed -e '/^\s*#/d' -e '/^\s*$/d'
        service:
          ui:
            type: "{{ k8s_plugin_longhorn_ui_service_type | default('LoadBalancer') }}"
        persistence:
          defaultClassReplicaCount: "{{ k8s_plugin_longhorn_default_class_replica_count | default(3) | int }}"
        defaultSettings:
          defaultDataPath: "{{ k8s_plugin_longhorn_data_path | default('/var/lib/longhorn') }}"
        longhornUI:
          replicas: "{{ k8s_plugin_longhorn_ui_replicas | default(1) | int }}"
    wait:
      labels: "app.kubernetes.io/instance=longhorn"

################################### headlamp ###################################
  # Headlamp as Kubernetes new UI to replace kubernetes-dashboard
  headlamp:
    enabled: "{{ k8s_plugin_headlamp_enabled | default(true) | bool }}"
    namespace: "headlamp-system"
    helm:
      repository:
        name: "{{ k8s_plugin_headlamp_helm_repo_name | default('headlamp') }}"
        url: "{{ k8s_plugin_headlamp_helm_repo_url | default('https://kubernetes-sigs.github.io/headlamp/') }}"
      release: "headlamp"
      chart: "headlamp/headlamp"
      version: "{{ k8s_plugin_headlamp_version | default('0.41.0') }}" # helm search repo headlamp/headlamp --versions
      values: # helm show values headlamp/headlamp | sed -e '/^\s*#/d' -e '/^\s*$/d'
        service:
          type: "{{ k8s_plugin_headlamp_service_type | default('LoadBalancer') }}"
    wait:
      labels: "app.kubernetes.io/name=headlamp"
    configuration:
      data: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: headlamp-user
          namespace: "headlamp-system"
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: headlamp-user
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: headlamp-user
          namespace: "headlamp-system"
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: headlamp-user-token # kubectl get secret headlamp-user-token -n headlamp-system -o jsonpath='{.data.token}' | base64 --decode
          namespace: "headlamp-system"
          annotations:
            kubernetes.io/service-account.name: "headlamp-user"
        type: kubernetes.io/service-account-token

################################### devops-gitlab ###################################
  devops-gitlab:
    enabled: "{{ k8s_plugin_gitlab_enabled | default(true) }}"
    namespace: "{{ k8s_plugin_gitlab_namespace | default('gitlab-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_gitlab_helm_repo_name | default('gitlab') }}"
        url: "{{ k8s_plugin_gitlab_helm_repo_url | default('https://charts.gitlab.io') }}"
      release: "{{ k8s_plugin_gitlab_helm_release | default('gitlab') }}"
      chart: "{{ k8s_plugin_gitlab_helm_chart | default('gitlab/gitlab') }}"
      version: "{{ k8s_plugin_gitlab_version | default('9.10.3') }}" # helm search repo gitlab/gitlab --versions
      # helm show values gitlab/gitlab --version 9.10.3 | sed -e '/^\s*#/d' -e '/^\s*$/d'
