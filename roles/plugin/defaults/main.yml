---
# roles/plugin/defaults/main.yml

# Safe proxy for GitHub manifests (ensures trailing slash)
k8s_plugin_manifest_proxy_safe: "{{ (k8s_plugin_manifest_proxy | default('')) | regex_replace('([^/])$', '\\1/') }}"

k8s_plugins:
################################### cni-flannel ###################################
  # Description: Simple and lightweight CNI plugin that provides an overlay network for Kubernetes.
  cni-flannel:
    enabled: "{{ k8s_plugin_flannel_enabled | default(false) | bool }}"
    namespace: "kube-system"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://github.com/flannel-io/flannel/releases/download/v{{ k8s_plugin_flannel_version | default('0.27.4') }}/kube-flannel.yml"
    wait:
      labels: "k8s-app=flannel"

################################### cni-calico ###################################
  # Description: High-performance CNI plugin with network policy enforcement and advanced routing.
  # Validate if patch works: kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.containers[0].env[] | select(.name=="CALICO_IPV4POOL_CIDR")'
  cni-calico:
    enabled: "{{ k8s_plugin_calico_enabled | default(false) | bool }}"
    namespace: "kube-system"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://raw.githubusercontent.com/projectcalico/calico/v{{ k8s_plugin_calico_version | default('3.31.1') }}/manifests/calico.yaml"
    patch:
      type: strategic
      resource: "daemonset/calico-node"
      data:
        spec:
          template:
            spec:
              containers:
              - name: calico-node
                env:
                - name: CALICO_IPV4POOL_CIDR
                  value: "{{ k8s_pod_subnet | default('10.244.0.0/16') }}"
    wait:
      labels: "k8s-app=calico"

################################### cni-cilium ###################################
  # Description: eBPF-based CNI plugin providing scalable networking, security, and observability.
  # Show latest N available versions: helm search repo cilium/cilium --versions |head -n 4
  cni-cilium:
    enabled: "{{ k8s_plugin_cilium_enabled | default(false) | bool }}"
    namespace: "{{ k8s_plugin_cilium_namespace | default('cilium-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_cilium_helm_repo_name | default('cilium') }}"
        url: "{{ k8s_plugin_cilium_helm_repo_url | default('https://helm.cilium.io') }}"
      release: "cilium"
      chart: "cilium/cilium"
      version: "{{ k8s_plugin_cilium_version | default('1.19.0') }}"
      values:
        operator:
          replicas: "{{ k8s_cilium_operator_replicas | default(2) | int }}"
        kubeProxyReplacement: "{{ k8s_cilium_kubeproxy_replacement | default(true) | bool }}"
        hubble:
          enabled: "{{ k8s_cilium_hubble_enabled | default(false) | bool }}"
          relay:
            enabled: "{{ k8s_cilium_hubble_relay_enabled | default(false) | bool }}"
          ui:
            enabled: "{{ k8s_cilium_hubble_ui_enabled | default(false) | bool }}"
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList:
              - "{{ k8s_pod_subnet | default('10.244.0.0/16') }}"
    wait:
      labels: "k8s-app=cilium"

################################### metallb ###################################
  # Description: Load-balancer implementation for bare-metal Kubernetes clusters working on Layer 4
  metallb:
    enabled: "{{ k8s_plugin_metallb_enabled | default(true) | bool }}"
    namespace: "{{ k8s_plugin_metallb_namespace | default('metallb-system') }}"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://raw.githubusercontent.com/metallb/metallb/v{{ k8s_plugin_metallb_version | default('0.15.3') }}/config/manifests/metallb-native.yaml"
    wait:
      labels: 
        - "app=metallb"
        - "component=controller"
    configuration:
      data: |
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: {{ k8s_plugin_metallb_default_ipaddresspool_name  | default('default-pool') }} # by default
          namespace: {{ k8s_plugin_metallb_namespace | default('metallb-system') }}
        spec:
          addresses: {{ k8s_plugin_metallb_default_ipaddresspool_range | default(['10.17.3.100-10.17.3.200']) }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: {{ k8s_plugin_metallb_traefik_ipaddresspool_name  | default('traefik-pool') }} # specially for traefik
          namespace: {{ k8s_plugin_metallb_namespace | default('metallb-system') }}
        spec:
          addresses: {{ k8s_plugin_metallb_traefik_ipaddresspool_range | default(['10.17.3.201-10.17.3.249']) }}
          autoAssign: false # manually specify
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default-l2-advertisement
          namespace: {{ k8s_plugin_metallb_namespace | default('metallb-system') }}
        spec:
          ipAddressPools:
          - {{ k8s_plugin_metallb_default_ipaddresspool_name  | default('default-pool') }}
          - {{ k8s_plugin_metallb_traefik_ipaddresspool_name  | default('traefik-pool') }}

################################### local-path-provisioner ###################################
  # Description: Dynamically provisions persistent local storage using host paths.
  # Validate if patch works: kubectl get configmap local-path-config -n local-path-storage -o json | jq '.data["config.json"] | fromjson'
  local-path-provisioner:
    enabled: "{{ k8s_plugin_local_path_provisioner_enabled | default(false) | bool }}"
    namespace: "local-path-storage"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://raw.githubusercontent.com/rancher/local-path-provisioner/v{{ k8s_plugin_local_path_provisioner_version | default('0.0.35') }}/deploy/local-path-storage.yaml"
    patch:
      type: json
      resource: "configmap/local-path-config"
      data:
        [
          {
            "op": "replace",
            "path": "/data/config.json",
            "value": "{{ {'nodePathMap': [{'node': 'DEFAULT_PATH_FOR_NON_LISTED_NODES', 'paths': [k8s_plugin_local_path_provisioner_default_path | default('/var/local/rancher/local-path')]}]} | to_json }}"
          }
        ]
    wait:
      labels: "app=local-path-provisioner"

################################### traefik ###################################
  # Description: Cloud-native ingress controller and edge router with automatic HTTPS.
  # Show latest N available versions: helm search repo traefik/traefik --versions |head -n 4
  # Show supported values: helm show values traefik/traefik --version 39.0.7 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  traefik:
    enabled: "{{ k8s_plugin_traefik_enabled | default(true) | bool }}"
    namespace: "{{ k8s_plugin_traefik_namespace | default('traefik-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_traefik_helm_repo_name | default('traefik') }}"
        url: "{{ k8s_plugin_traefik_helm_repo_url | default('https://traefik.github.io/charts') }}"
      release: "traefik"
      chart: "traefik/traefik"
      version: "{{ k8s_plugin_traefik_version | default('39.0.7') }}"
    wait:
      labels: "app.kubernetes.io/instance=traefik"
    ingress:
      enabled: true

################################### longhorn ###################################
  # Description: Distributed block storage system with snapshots, backups, and DR.
  # Show latest N available versions: helm search repo longhorn/longhorn --versions |head -n 4
  # Show supported values: helm show values longhorn/longhorn --version 1.11.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  longhorn:
    enabled: "{{ k8s_plugin_longhorn_enabled | default(true) | bool }}"
    depends_on: ['traefik']
    namespace: "{{ k8s_plugin_longhorn_namespace | default('longhorn-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_longhorn_helm_repo_name | default('longhorn') }}"
        url: "{{ k8s_plugin_longhorn_helm_repo_url | default('https://charts.longhorn.io') }}"
      release: "longhorn"
      chart: "longhorn/longhorn"
      version: "{{ k8s_plugin_longhorn_version | default('1.11.1') }}"
    wait:
      labels: "app.kubernetes.io/instance=longhorn"
    ingress:
      tls:
        enabled: "{{ k8s_plugin_longhorn_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_longhorn_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"

################################### harbor ###################################
  # Description: Cloud-native registry that stores, signs, and scans content.
  # Show latest N available versions: helm search repo harbor/harbor --versions |head -n 4
  # Show supported values: helm show values harbor/harbor --version 1.18.3 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  # Get admin password: kubectl get secret harbor-admin-password -n harbor-system -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d && echo
  harbor:
    enabled: "{{ k8s_plugin_harbor_enabled | default(true) | bool }}"
    depends_on: ['traefik','longhorn']
    namespace: "{{ k8s_plugin_harbor_namespace | default('harbor-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_harbor_helm_repo_name | default('goharbor') }}"
        url: "{{ k8s_plugin_harbor_helm_repo_url | default('https://helm.goharbor.io') }}"
      release: "{{ k8s_plugin_harbor_helm_release | default('harbor') }}"
      chart: "{{ k8s_plugin_harbor_helm_chart | default('goharbor/harbor') }}"
      version: "{{ k8s_plugin_harbor_version | default('1.18.3') }}"
    wait:
      labels: "app=harbor"
    ingress:
      tls:
        enabled: "{{ k8s_plugin_harbor_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_harbor_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"

################################### headlamp ###################################
  # Description: Extensible Kubernetes web UI with multi-cluster support to replace legacy kubernetes-dashboard.
  # Show latest N available versions: helm search repo headlamp/headlamp --versions |head -n 4
  # Show supported values: helm show values headlamp/headlamp --version 0.41.0 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  # Schema of values: https://github.com/kubernetes-sigs/headlamp/blob/v0.41.0/charts/headlamp/values.schema.json
  # How to get token: kubectl get secret -n headlamp-system headlamp-user-token -o jsonpath='{.data.token}' | base64 --decode && echo
  headlamp:
    enabled: "{{ k8s_plugin_headlamp_enabled | default(false) | bool }}"
    depends_on: ['traefik','longhorn']
    namespace: "headlamp-system"
    helm:
      repository:
        name: "{{ k8s_plugin_headlamp_helm_repo_name | default('headlamp') }}"
        url: "{{ k8s_plugin_headlamp_helm_repo_url | default('https://kubernetes-sigs.github.io/headlamp/') }}"
      release: "headlamp"
      chart: "headlamp/headlamp"
      version: "{{ k8s_plugin_headlamp_version | default('0.41.0') }}"
    wait:
      labels: "app.kubernetes.io/name=headlamp"
    configuration:
      data: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: headlamp-user
          namespace: "headlamp-system"
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: headlamp-user
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: headlamp-user
          namespace: "headlamp-system"
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: headlamp-user-token
          namespace: "headlamp-system"
          annotations:
            kubernetes.io/service-account.name: "headlamp-user"
        type: kubernetes.io/service-account-token
    ingress:
      tls:
        enabled: "{{ k8s_plugin_headlamp_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_headlamp_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"

################################### metricsserver ###################################
  # Description: Cluster-wide aggregator of resource usage metrics (CPU, memory) for HPA and kubectl top.
  # Validate if patch works: kubectl get deployment metrics-server -n kube-system -o json | jq '.spec.template.spec.containers[0].args'
  metrics-server:
    enabled: "{{ k8s_plugin_metricsserver_enabled | default(false) | bool }}"
    namespace: "kube-system"
    manifest: "{{ k8s_plugin_manifest_proxy_safe | default('') }}https://github.com/kubernetes-sigs/metrics-server/releases/download/v{{ k8s_plugin_metricsserver_version | default('0.8.1') }}/components.yaml"
    patch:
      type: json
      resource: "deployment/metrics-server"
      data:
        [
          {
            "op": "add",
            "path": "/spec/template/spec/containers/0/args/-",
            "value": "--kubelet-insecure-tls"
          }
        ]
    wait:
      labels: "k8s-app=metrics-server"

################################### gitlab ###################################
  # Description: Full DevOps platform providing Git repositories, CI/CD pipelines
  # Show available version: helm search repo gitlab-jh/gitlab --versions |head -n 4
  # Show supported values: helm show values gitlab-jh/gitlab --version 9.11.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  # Get password of `root` when logon in web:         kubectl get secret -n gitlab-system gitlab-gitlab-initial-root-password -o jsonpath="{.data.password}" | base64 --decode && echo
  # Get password of DB user `gitlab` in postgresql:   kubectl get secret -n gitlab-system gitlab-postgresql-password -o jsonpath="{.data.postgresql-password}" | base64 -d && echo
  # Get password of DB user `postgres` in postgresql: kubectl get secret -n gitlab-system gitlab-postgresql-password -o jsonpath="{.data.postgresql-postgres-password}" | base64 -d && echo
  gitlab:
    enabled: "{{ k8s_plugin_gitlab_enabled | default(false) }}"
    depends_on: ['traefik','longhorn']
    namespace: "{{ k8s_plugin_gitlab_namespace | default('gitlab-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_gitlab_helm_repo_name | default('gitlab-jh') }}"
        url: "{{ k8s_plugin_gitlab_helm_repo_url | default('https://charts.gitlab.cn') }}"
      release: "{{ k8s_plugin_gitlab_helm_release | default('gitlab') }}"
      chart: "{{ k8s_plugin_gitlab_helm_chart | default('gitlab-jh/gitlab') }}"
      version: "{{ k8s_plugin_gitlab_version | default('9.11.1') }}"
    wait:
      labels: "app=webservice"
    ingress:
      tls:
        enabled: "{{ k8s_plugin_gitlab_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_gitlab_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"

################################### openproject ###################################
  # Description: Open-source project management tool (alternative to Jira)
  # Show latest N available versions: helm search repo openproject/openproject --versions |head -n 4
  # Show supported values: helm show values openproject/openproject --version 13.5.1 | sed -e '/^\s*#/d' -e '/^\s*$/d'
  openproject:
    enabled: "{{ k8s_plugin_openproject_enabled | default(false) }}"
    depends_on: ['traefik','longhorn']
    namespace: "{{ k8s_plugin_openproject_namespace | default('openproject-system') }}"
    helm:
      repository:
        name: "{{ k8s_plugin_openproject_helm_repo_name | default('openproject') }}"
        url: "{{ k8s_plugin_openproject_helm_repo_url | default('https://charts.openproject.org') }}"
      release: "{{ k8s_plugin_openproject_helm_release | default('openproject') }}"
      chart: "{{ k8s_plugin_openproject_helm_chart | default('openproject/openproject') }}"
      version: "{{ k8s_plugin_openproject_version | default('13.5.1') }}"
    wait:
      labels: "app=openproject"
    ingress:
      tls:
        enabled: "{{ k8s_plugin_openproject_ingress_tls_enabled | default(true) | bool }}"
        secret_name: "{{ k8s_plugin_openproject_ingress_tls_secret_name | default('mkcert-wildcard-tls') }}"
