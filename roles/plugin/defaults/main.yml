---
k8s_plugins:
  # Metrics Server to collect metrics(CPU, Memory, ...)
  metrics-server:
    enabled: "{{ k8s_plugin_metrics_server_enabled | default(true) | bool }}"
    namespace: "kube-system"
    manifest:
      "https://github.com/kubernetes-sigs/metrics-server/releases/download/v\
      {{ k8s_plugin_metrics_server_version | default('0.8.0') }}\
      /components.yaml"
    label: "k8s-app=metrics-server"
    patch:
      resource: "deployment/metrics-server"
      data: |
        [
          {
            "op": "add",
            "path": "/spec/template/spec/containers/0/args/-",
            "value": "--kubelet-insecure-tls"
          }
        ]

  # Local Path Provisioner to provision local storage
  local-path-provisioner:
    enabled: "{{ k8s_plugin_local_path_provisioner_enabled | default(true) | bool }}"
    namespace: "local-path-storage"
    manifest:
      "https://raw.githubusercontent.com/rancher/local-path-provisioner/v\
      {{ k8s_plugin_local_path_provisioner_version | default('0.0.32') }}\
      /deploy/local-path-storage.yaml"
    label: "app=local-path-provisioner"
    patch:
      resource: "configmap/local-path-config"
      data: |
        [
          {
            "op": "replace",
            "path": "/data/config.json",
            "value": "{\"nodePathMap\":[{\"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\",\"paths\":[\"\
              {{ k8s_plugin_local_path_provisioner_default_path | default('/var/local/rancher/local-path-provisioner') }}\
              \"]}]}"
          }
        ]

  # MetalLB to provide load balancer
  metallb:
    enabled: "{{ k8s_plugin_metallb_enabled | default(true) | bool }}"
    namespace: "metallb-system"
    manifest: "https://raw.githubusercontent.com/metallb/metallb/v\
      {{ k8s_plugin_metallb_version | default('0.13.12') }}\
      /config/manifests/metallb-native.yaml"
    label: "app=metallb"
    configuration:
      data: |
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: metallb-system
        spec:
          addresses: {{ k8s_plugin_metallb_ip_range | default(['10.17.3.240-10.17.3.250']) }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default-l2-advertisement
          namespace: metallb-system
        spec:
          ipAddressPools:
          - default-pool

  # Provide distributed block storage
  longhorn:
    enabled: "{{ k8s_plugin_longhorn_enabled | default(true) | bool }}"
    namespace: "{{ k8s_plugin_longhorn_namespace | default('longhorn-system') }}"
    helm:
      repository:
        name: "longhorn"
        url: "https://charts.longhorn.io"
      release: "longhorn"
      chart: "longhorn/longhorn"
      version: "{{ k8s_plugin_longhorn_version | default('1.11.0') }}"
      values:
        service:
          ui:
            type: "{{ k8s_plugin_longhorn_ui_service_type | default('LoadBalancer') }}"
            port: "{{ k8s_plugin_longhorn_ui_service_port | default(80) | int }}"
        persistence:
          defaultClassReplicaCount: "{{ k8s_plugin_longhorn_default_class_replica_count | default(2) | int }}"
        defaultSettings:
          defaultReplicaCount: "{{ k8s_plugin_longhorn_default_replica_count | default(2) | int }}"
          defaultDataPath: "{{ k8s_plugin_longhorn_data_path | default('/var/lib/longhorn') }}"
        csi:
          attacherReplicaCount: "{{ k8s_plugin_longhorn_csi_replica_count | default(2) | int }}"
          provisionerReplicaCount: "{{ k8s_plugin_longhorn_csi_replica_count | default(2) | int }}"
          resizerReplicaCount: "{{ k8s_plugin_longhorn_csi_replica_count | default(2) | int }}"
          snapshotterReplicaCount: "{{ k8s_plugin_longhorn_csi_replica_count | default(2) | int }}"
        longhornUI:
          replicas: "{{ k8s_plugin_longhorn_ui_replicas | default(2) | int }}"
    label: "app.kubernetes.io/instance=longhorn"

  # Headlamp as Kubernetes new UI to replace kubernetes-dashboard
  headlamp:
    enabled: "{{ k8s_plugin_headlamp_enabled | default(false) | bool }}"
    namespace: "headlamp-system"
    helm:
      repository:
        name: "headlamp"
        url: "https://kubernetes-sigs.github.io/headlamp/"
      release: "headlamp"
      chart: "headlamp/headlamp"
      version: "{{ k8s_plugin_headlamp_version | default('0.40.0') }}"
      values:
        replicaCount: 1
        service:
          type: "{{ k8s_plugin_headlamp_service_type | default('LoadBalancer') }}"
          port: "{{ k8s_plugin_headlamp_service_port | default(80) | int }}"
    label: "app.kubernetes.io/name=headlamp"
    configuration:
      data: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: headlamp-user
          namespace: "headlamp-system"
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: headlamp-user
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: headlamp-user
          namespace: "headlamp-system"
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: headlamp-user-token
          namespace: "headlamp-system"
          annotations:
            kubernetes.io/service-account.name: "headlamp-user"
        type: kubernetes.io/service-account-token
