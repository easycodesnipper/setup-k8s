---
k8s_plugins:
  enabled: >
    {{ 
      lookup('env', 'K8S_PLUGINS_ENABLED') |
      default(K8S_PLUGINS_ENABLED, true) | 
      default(true, true) |
      bool 
    }}
  # Metrics Server to collect metrics(CPU, Memory, ...)
  metrics-server:
    enabled: >
      {{ 
        lookup('env', 'K8S_METRICS_SERVER_ENABLED') |
        default(K8S_METRICS_SERVER_ENABLED, true) | 
        default(true, true) |
        bool 
      }}
    namespace: "kube-system"
    manifest: "https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.0/components.yaml"
    label: "k8s-app=metrics-server"
    patch:
      resource: "deployment/metrics-server"
      data: |
        [
          {
            "op": "add",
            "path": "/spec/template/spec/containers/0/args/-",
            "value": "--kubelet-insecure-tls"
          }
        ]

  # Local Path Provisioner to provision local storage
  local-path-provisioner:
    enabled: >
      {{ 
        lookup('env', 'K8S_LOCAL_PATH_PROVISIONER_ENABLED') |
        default(K8S_LOCAL_PATH_PROVISIONER_ENABLED, true) | 
        default(true, true) |
        bool 
      }}
    namespace: "local-path-storage"
    manifest: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.32/deploy/local-path-storage.yaml"
    label: "app=local-path-provisioner"
    patch:
      resource: "configmap/local-path-config"
      data: |
        [
          {
            "op": "replace",
            "path": "/data/config.json",
            "value": "{\"nodePathMap\":[{\"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\",\"paths\":[\"{{ k8s_plugin_local_path_provisioner_default_path }}\"]}]}"
          }
        ]
    configuration:
      # Reserve a default pvc with ReadWriteOnce access mode in default namespace
      # local-path-provisioner limitation: only supports ReadWriteOnce and ReadWriteOncePod (1.22+) access
      data: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: local-path-pvc
          namespace: default
        spec:
          accessModes:
            - {{ k8s_plugin_local_path_provisioner_pvc_access_mode | default('ReadWriteOnce') }}
          storageClassName: local-path
          resources:
            requests:
              storage: {{ k8s_plugin_local_path_provisioner_pvc_request_size | default('10Gi') }}

  # MetalLB to provide load balancer
  metallb:
    enabled: >
      {{ 
        lookup('env', 'K8S_METALLB_ENABLED') |
        default(K8S_METALLB_ENABLED, true) | 
        default(true, true) |
        bool 
      }}
    namespace: "metallb-system"
    manifest: "https://raw.githubusercontent.com/metallb/metallb/v0.13.12/config/manifests/metallb-native.yaml"
    label: "app=metallb"
    configuration:
      data: |
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: metallb-system
        spec:
          addresses: {{ k8s_plugin_metallb_ip_range }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: default-l2-advertisement
          namespace: metallb-system
        spec:
          ipAddressPools:
          - default-pool
  # Kubernetes Dashboard
  dashboard:
    enabled: >
      {{ 
        lookup('env', 'K8S_DASHBOARD_ENABLED') |
        default(K8S_DASHBOARD_ENABLED, true) | 
        default(true, true) |
        bool 
      }}
    namespace: "kubernetes-dashboard"
    helm:
      repository:
        name: "kubernetes-dashboard"
        url: "https://kubernetes.github.io/dashboard/"
      releases: "kubernetes-dashboard"
      chart: "kubernetes-dashboard/kubernetes-dashboard"
      version: "7.14.0"
      reuse-values:
        - "kong.proxy.type=LoadBalancer"
    label: "app.kubernetes.io/instance=kubernetes-dashboard"
    patch:
      resource: "service/kubernetes-dashboard-kong-proxy"
      data: |
        [
          {
            "op": "replace",
            "path": "/spec/type",
            "value": "LoadBalancer"
          }
        ]
    configuration:
      data: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: admin-user
          namespace: kubernetes-dashboard
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: admin-user
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: admin-user
          namespace: kubernetes-dashboard
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: admin-user
          namespace: kubernetes-dashboard
          annotations:
            kubernetes.io/service-account.name: "admin-user"
        type: kubernetes.io/service-account-token
