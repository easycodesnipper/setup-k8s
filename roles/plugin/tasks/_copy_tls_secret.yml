---
# roles/plugin/tasks/_copy_tls_secret.yml

- name: Ensure target namespace "{{ target_namespace }}" exists
  ansible.builtin.shell: |
    kubectl create namespace {{ target_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: false

- name: Extract certificate and key from source secret ({{ source_namespace | default('ca-system') }}/{{ source_secret_name | default('mkcert-wildcard-tls') }})
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get secret {{ source_secret_name | default('mkcert-wildcard-tls') }} \
      -n {{ source_namespace | default('ca-system') }} \
      -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/{{ source_secret_name | default('mkcert-wildcard-tls') }}.crt
    kubectl get secret {{ source_secret_name | default('mkcert-wildcard-tls') }} \
      -n {{ source_namespace | default('ca-system') }} \
      -o jsonpath='{.data.tls\.key}' | base64 -d > /tmp/{{ source_secret_name | default('mkcert-wildcard-tls') }}.key
  args:
    executable: /bin/bash
  register: extract
  changed_when: false

- name: Create or update TLS secret in target namespace ({{ target_namespace }}/{{ target_secret_name | default(source_secret_name | default('mkcert-wildcard-tls')) }})
  ansible.builtin.shell: |
    kubectl create secret tls {{ target_secret_name | default(source_secret_name | default('mkcert-wildcard-tls')) }} \
      --cert=/tmp/{{ source_secret_name | default('mkcert-wildcard-tls') }}.crt \
      --key=/tmp/{{ source_secret_name | default('mkcert-wildcard-tls') }}.key \
      --namespace={{ target_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: create_result
  changed_when: "'created' in create_result.stdout or 'configured' in create_result.stdout"

- name: Cleanup temporary certificate files
  ansible.builtin.file:
    path: "{{ cleanup_item }}"
    state: absent
  loop:
    - "/tmp/{{ source_secret_name | default('mkcert-wildcard-tls') }}.crt"
    - "/tmp/{{ source_secret_name | default('mkcert-wildcard-tls') }}.key"
  loop_control:
    label: "Cleanup {{ item }}"
    loop_var: cleanup_item
  when: extract is defined
  no_log: true

