---
# roles/plugin/tasks/_create_secret.yml

- name: "Create namespace {{ k8s_secret_namespace }} if missing"
  ansible.builtin.shell: |
    kubectl create namespace {{ k8s_secret_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- ansible.builtin.debug:  
    msg: "{{ k8s_secret_data }}"

- name: "Create or Update Kubernetes Secret: {{ k8s_secret_name }}"
  ansible.builtin.shell: |
    kubectl create secret generic {{ k8s_secret_name }} \
      -n {{ k8s_secret_namespace }} \
      {% for key, value in k8s_secret_data.items() %}
      --from-literal={{ key }}={{ value | quote }} \
      {% endfor -%}
      --dry-run=client -o yaml | kubectl apply -f -
