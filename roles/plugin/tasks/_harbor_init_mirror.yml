---
# roles/plugin/tasks/_harbor_init_mirror.yml

- name: "Harbor initialize registry mirror {{ mirror_item.name }}"
  block:
    - name: "Harbor API | Wait for service to be online"
      ansible.builtin.uri:
        url: "https://{{ k8s_plugin_harbor_ingress_host | default('harbor.localdomain') }}/api/v2.0/ping"
        method: GET
        validate_certs: false
        status_code: 200
      register: _api_check
      until: _api_check.status == 200
      retries: 20
      delay: 30

    - name: "Harbor API | Retrieve admin password from secret"
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get secret {{ k8s_harbor_admin_password_secret_name | default('harbor-admin-password') }} -n {{ plugin_config.namespace }} -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d
      args:
        executable: /bin/bash
      register: _current_pwd_cmd
      changed_when: false

    - name: "Harbor API | Set internal password fact"
      ansible.builtin.set_fact:
        _api_password: "{{ _current_pwd_cmd.stdout }}"
      no_log: true

    - name: "Harbor API | Create registry endpoint for {{ mirror_item.name }}"
      ansible.builtin.uri:
        url: "https://{{ k8s_plugin_harbor_ingress_host | default('harbor.localdomain') }}/api/v2.0/registries"
        method: POST
        user: "admin"
        password: "{{ _api_password }}"
        force_basic_auth: true
        body_format: json
        validate_certs: false
        body:
          name: "{{ mirror_item.name }}"
          url: "{{ mirror_item.url }}"
          type: "{{ mirror_item.type }}"
          insecure: false
        status_code: [201, 409]
      register: _registry_create_response
      until: _registry_create_response.status == 201 or _registry_create_response.status == 409
      retries: 3
      delay: 10

    - name: "Harbor API | Get endpoint ID for {{ mirror_item.name }}"
      ansible.builtin.uri:
        url: "https://{{ k8s_plugin_harbor_ingress_host | default('harbor.localdomain') }}/api/v2.0/registries?name={{ mirror_item.name }}"
        method: GET
        user: "admin"
        password: "{{ _api_password }}"
        force_basic_auth: true
        validate_certs: false
      register: _endpoint_query

    - name: "Harbor API | Create project for: {{ mirror_item.name }}"
      ansible.builtin.uri:
        url: "https://{{ k8s_plugin_harbor_ingress_host | default('harbor.localdomain') }}/api/v2.0/projects"
        method: POST
        user: "admin"
        password: "{{ _api_password }}"
        force_basic_auth: true
        body_format: json
        validate_certs: false
        body: |
          {
            "project_name": "{{ mirror_item.name }}",
            "public": true,
            "registry_id": {{ _endpoint_query.json[0].id | int }},
            "metadata": {
              "proxy_cache": "true"
            }
          }
        status_code: [201, 409]
      register: _project_creation_result
      until: _project_creation_result.status == 201 or _project_creation_result.status == 409
      retries: 3
      delay: 10
  when: not ansible_check_mode
