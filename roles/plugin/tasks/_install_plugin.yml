# roles/plugin/tasks/_install_plugin.yml
---
- name: "Plugin {{ plugin_name }} | Install via Manifest"
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ plugin_config.manifest }}"
  when: 
    - plugin_config['manifest'] is defined
    - plugin_config['manifest'] is string
  changed_when: true
  tags: plugin-install-via-manifest

- name: "Plugin {{ plugin_name }} | Helm Operations"
  block:
    - name: "Add Helm repository"
      ansible.builtin.command: >
        helm repo add {{ plugin_config.helm.repository.name }} {{ plugin_config.helm.repository.url }}
      register: helm_repo_add
      until: helm_repo_add is success
      retries: 5
      delay: 10
      changed_when: "'has been added' in helm_repo_add.stdout"
      when: 
        - plugin_config['helm']['repository'] is defined
        - plugin_config['helm']['repository'] is mapping

    - name: "Update Helm repository"
      ansible.builtin.command: >
        helm repo update {{ plugin_config.helm.repository.name }}
      changed_when: false
      failed_when: false
      when: 
        - plugin_config['helm']['repository'] is defined
        - plugin_config['helm']['repository'] is mapping

    - name: "Write Helm default values to temp file"
      ansible.builtin.copy:
        content: "{{ plugin_config['helm']['values'] | deep_convert | to_nice_yaml(indent=2) }}"
        dest: "/tmp/{{ plugin_name }}-helm-values.yaml"
        mode: '0644'
      when: 
        - plugin_config['helm']['values'] is defined
        - plugin_config['helm']['values'] is mapping

    - name: "Render Helm j2 template file values to temp file"
      ansible.builtin.template:
        src: "{{ plugin_name }}-helm-values.yaml.j2"
        dest: "/tmp/{{ plugin_name }}-helm-values.yaml"
        mode: '0644'
      when: >
        plugin_config['helm']['values'] is not defined or 
        plugin_config['helm']['values'] is not mapping

    - name: Ensure local chart directory exists
      ansible.builtin.file:
        path: "/tmp/{{ plugin_name }}-helm-chart"
        state: directory
        mode: '0755'

    - name: Pull Helm chart to local
      ansible.builtin.shell: |
        set -o pipefail
        helm pull {{ plugin_config.helm.chart }} \
          --version {{ plugin_config.helm.version }} \
          --destination "/tmp/{{ plugin_name }}-helm-chart"
      args:
        executable: /bin/bash
      register: pull_result
      until: pull_result is success
      retries: 5
      delay: 10
      changed_when: false

    - name: Find downloaded chart archive
      ansible.builtin.find:
        paths: "/tmp/{{ plugin_name }}-helm-chart"
        patterns: "*.tgz"
      register: chart_file

    - name: Fail if chart not found
      ansible.builtin.fail:
        msg: "Helm chart not found after pull"
      when: chart_file.files | length == 0

    - name: Install/Upgrade Helm release using local chart
      vars:
        _values_file: "/tmp/{{ plugin_name }}-helm-values.yaml"
      ansible.builtin.shell: |
        set -o pipefail
        helm upgrade --install {{ plugin_config.helm.release }} {{ chart_file.files[0].path }} \
          --namespace {{ plugin_config.namespace | default('kube-system') }} \
          --create-namespace \
          -f {{ _values_file }}
      args:
        executable: /bin/bash
      register: helm_result
      until: helm_result is success
      retries: 5
      delay: 10
      changed_when: "'deployed' in helm_result.stdout or 'upgraded' in helm_result.stdout"
  when: 
    - plugin_config['helm'] is defined
    - plugin_config['helm'] is mapping
  tags: plugin-install-via-helm

