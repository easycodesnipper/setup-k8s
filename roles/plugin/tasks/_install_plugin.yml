# roles/plugin/tasks/_install_plugin.yml
---
- name: "Plugin {{ plugin_name }} | Check dependencies"
  ansible.builtin.include_tasks: _check_deps.yml
- name: "Plugin {{ plugin_name }} | Copy TLS secret from CA Server and Verify"
  when:
    - plugin_config.namespace | default('default') != 'traefik-system'
    - plugin_config.ingress is defined
    - plugin_config.ingress.tls is defined
    - plugin_config.ingress.tls.enabled | default(true) | bool

  block:
    - name: Copy TLS secret from CA Server
      ansible.builtin.include_tasks: _copy_tls_secret.yml
      vars:
        target_namespace: "{{ plugin_config.namespace }}"
        source_secret_name: "{{ plugin_config.ingress.tls.secret_name | default('mkcert-wildcard-tls') }}"
        target_secret_name: "{{ source_secret_name | default('mkcert-wildcard-tls') }}"

    - name: Verify TLS secret certificate is signed by root CA
      ansible.builtin.include_tasks: _verify_tls_secret.yml
      vars:
        tls_secret_name: "{{ plugin_config.ingress.tls.secret_name | default('mkcert-wildcard-tls') }}"
        tls_secret_namespace: "{{ plugin_config.namespace }}"
- name: "Plugin {{ plugin_name }} | Install via Manifest"
  when:
    - plugin_config['manifest'] is defined
    - plugin_config['manifest'] is string
  tags: plugin-install-via-manifest

  block:
    - name: "Plugin {{ plugin_name }} | Set local manifest path"
      ansible.builtin.set_fact:
        local_manifest_path: "/tmp/{{ plugin_name }}-manifest.yaml"

    - name: "Plugin {{ plugin_name }} | Download manifest if not exists"
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL {{ plugin_config['manifest'] }} -o {{ local_manifest_path }}
      args:
        creates: "{{ local_manifest_path }}"
        executable: /bin/bash
      register: manifest_download
      until: manifest_download is success
      retries: 5
      delay: 15

    - name: "Plugin {{ plugin_name }} | Apply via local manifest"
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ local_manifest_path }}"
      changed_when: true
- name: "Plugin {{ plugin_name }} | Install via Helm"
  when:
    - plugin_config['helm'] is defined
    - plugin_config['helm'] is mapping
  tags: plugin-install-via-helm

# - name: "Plugin {{ plugin_name }} | Debug patch"
#   vars:
#     patch_type: "{{ plugin_config.patch.type | default('json') }}"
#     patch_data_to_json: "{{ plugin_config.patch.data | to_json }}"
#     patch_data_to_yaml: "{{ plugin_config.patch.data | to_yaml }}"
#     debug_data: >-
#       {%
#         if patch_type == 'json'
#       %}
#         {{ patch_data_to_json }}
#       {% else %}
#         {{ patch_data_to_yaml }}
#       {% endif %}
#   ansible.builtin.debug:
#     msg:
#       - "Plugin: {{ plugin_name }}"
#       - "Patch type: {{ patch_type }}"
#       - "Patch resource: {{ plugin_config.patch.resource }}"
#       - "Patch data string: {{ debug_data }}"
#   when: plugin_config.patch is defined
#   tags: plugin-patch-debug

  block:
    - name: Install Helm
      ansible.builtin.include_role:
        name: helm
      run_once: true

    - name: "Plugin {{ plugin_name }} |  Check if Helm repository already exists"
      ansible.builtin.command: >
        helm repo list --output yaml
      register: helm_repo_list
      changed_when: false
      failed_when: false
      when:
        - plugin_config['helm']['repository'] is defined
        - plugin_config['helm']['repository'] is mapping

    - name: "Plugin {{ plugin_name }} | Add Helm repository and update if not present"
      when: (helm_repo_list.stdout | from_yaml | selectattr('name', 'equalto', plugin_config.helm.repository.name) | list | length) == 0

      block:
        - name: Add Helm repository only if missing
          ansible.builtin.command: >
            helm repo add {{ plugin_config.helm.repository.name }} {{ plugin_config.helm.repository.url }}
          register: helm_repo_add
          until: helm_repo_add is success
          retries: 5
          delay: 10
          changed_when: "'has been added' in helm_repo_add.stdout"
          when:
            - plugin_config['helm']['repository'] is defined
            - plugin_config['helm']['repository'] is mapping

        - name: "Plugin {{ plugin_name }} | Update Helm repository index"
          ansible.builtin.command: >
            helm repo update {{ plugin_config.helm.repository.name }}
          register: helm_repo_update
          until: helm_repo_update is success
          retries: 5
          delay: 10
          changed_when: false
          when:
            - plugin_config['helm']['repository'] is defined
            - plugin_config['helm']['repository'] is mapping
    - name: "Plugin {{ plugin_name }} | Write Helm default values to temp file"
      ansible.builtin.copy:
        content: "{{ plugin_config['helm']['values'] | deep_convert | to_nice_yaml(indent=2) }}"
        dest: "/tmp/{{ plugin_name }}-helm-values.yaml"
        mode: "0644"
      when:
        - plugin_config['helm']['values'] is defined
        - plugin_config['helm']['values'] is mapping

    - name: "Plugin {{ plugin_name }} | Render Helm j2 template file values to temp file"
      ansible.builtin.template:
        src: "{{ plugin_name }}-helm-values.yaml.j2"
        dest: "/tmp/{{ plugin_name }}-helm-values.yaml"
        mode: "0644"
      when: >
        (plugin_config['helm']['values'] is not defined)
        or (plugin_config['helm']['values'] is not mapping)

    - name: "Plugin {{ plugin_name }} | Ensure local chart directory exists"
      ansible.builtin.file:
        path: "/tmp/{{ plugin_name }}-helm-chart"
        state: directory
        mode: "0755"

    - name: "Plugin {{ plugin_name }} | Set expected chart file path"
      ansible.builtin.set_fact:
        _chart_file_path: "/tmp/{{ plugin_name }}-helm-chart/{{ plugin_config.helm.chart | split('/') | last }}-{{ plugin_config.helm.version }}.tgz"

    - name: "Plugin {{ plugin_name }} | Check if chart archive already exists"
      ansible.builtin.stat:
        path: "{{ _chart_file_path }}"
      register: _chart_stat

    - name: "Plugin {{ plugin_name }} | Pull Helm chart to local directory (only if missing)"
      when: not _chart_stat.stat.exists
      ansible.builtin.shell: |
        set -o pipefail
        helm pull {{ plugin_config.helm.chart }} \
          --version {{ plugin_config.helm.version }} \
          --destination "/tmp/{{ plugin_name }}-helm-chart"
      args:
        executable: /bin/bash
      register: pull_result
      until: pull_result is success
      retries: 60
      delay: 5
      changed_when: true

    - name: "Plugin {{ plugin_name }} | Fail if chart file still missing (e.g., pull failed or wrong naming)"
      ansible.builtin.fail:
        msg: "Helm chart not found at {{ _chart_file_path }}"
      when: not ansible_check_mode and not _chart_stat.stat.exists and (pull_result is skipped or pull_result.failed)

    - name: "Plugin {{ plugin_name }} | Install/Upgrade Helm release with local chart"
      vars:
        _values_file: "/tmp/{{ plugin_name }}-helm-values.yaml"
      ansible.builtin.shell: |
        set -o pipefail
        helm upgrade --install {{ plugin_config.helm.release }} {{ _chart_file_path }} \
          --namespace {{ plugin_config.namespace | default('default') }} \
          --create-namespace \
          -f {{ _values_file }}
      args:
        executable: /bin/bash
      register: helm_result
      until: helm_result is success
      retries: 5
      delay: 10
      changed_when: "'deployed' in helm_result.stdout or 'upgraded' in helm_result.stdout"
- name: "Plugin {{ plugin_name }} | Apply {{ plugin_config.patch.type | default('json') }} Patch"
  vars:
    patch_type: "{{ plugin_config.patch.type | default('json') }}"
    patch_data: "{{ plugin_config.patch.data | to_json }}"
  ansible.builtin.shell: |
    kubectl patch {{ plugin_config.patch.resource }} \
      -n {{ plugin_config.namespace | default('default') }} \
      --type {{ patch_type }} -p '{{ patch_data }}'
  when:
    - plugin_config['patch'] is defined
    - plugin_config['patch'] is mapping
  changed_when: true
  tags: plugin-patch-apply

- name: "Plugin {{ plugin_name }} | Wait for Resource Ready"
  vars:
    _wait_dict: "{{ plugin_config.wait | default({}) }}"
    _labels: "{{ _wait_dict.labels | default('') }}"
    _selector: "{{ _labels | join(',') if _labels is sequence else _labels }}"
    _raw_condition: "{{ _wait_dict.condition | default('Ready') }}"
    _condition: "{{ _raw_condition if 'condition=' in _raw_condition else 'condition=' + _raw_condition }}"
    _resource: "{{ _wait_dict.resource | default('pod') }}"
  ansible.builtin.command: >
    kubectl wait --for={{ _condition }} {{ _resource }} -n {{ plugin_config.namespace | default('default') }} {% if _selector | length > 0 %} --selector="{{ _selector }}"{% endif %} --timeout={{ _wait_dict.timeout | default('5m') }}
  when:
    - plugin_config.wait is defined
    - plugin_config.wait.enabled | default(true) | bool
  failed_when: false
  changed_when: false
  tags: plugin-wait-ready

- name: "Plugin {{ plugin_name }} | Apply Custom Configuration"
  ansible.builtin.command: >
    kubectl apply -f -
  args:
    stdin: "{{ plugin_config.configuration.data }}"
  when:
    - plugin_config['configuration'] is defined
    - plugin_config['configuration'] is mapping
    - plugin_config['configuration']['data'] is defined
  changed_when: true
  register: apply_result
  until: apply_result.rc == 0
  retries: 5
  delay: 30
  tags: plugin-post-config

- name: "Plugin {{ plugin_name }} | Create ingress domain mapping in /etc/hosts"
  ansible.builtin.include_tasks: _ingress_domain_mapping.yml
  when:
    - plugin_config.ingress is defined
    - plugin_config.ingress.enabled | default(true) | bool
