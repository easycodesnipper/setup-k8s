---
# roles/plugin/tasks/_verify_tls_secret.yml

- name: Verify TLS secret certificate is signed by the root CA
  block:
    - name: Get TLS secret certificate data
      ansible.builtin.shell: |
        kubectl get secret {{ tls_secret_name }} \
          -n {{ tls_secret_namespace }} \
          -o jsonpath='{.data.tls\.crt}' | base64 -d
      register: tls_cert_pem
      changed_when: false
      no_log: true

    - name: Write certificate to temporary file
      ansible.builtin.tempfile:
        suffix: .crt
      register: cert_temp_file

    - name: Save certificate content
      ansible.builtin.copy:
        content: "{{ tls_cert_pem.stdout }}"
        dest: "{{ cert_temp_file.path }}"
        mode: '0644'

    # how to verity:
    # kubectl get secret mkcert-wildcard-tls -n ca-system -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl verify -CAfile /usr/local/share/ca-certificates/rootCA.crt --cert
    - name: Verify certificate against root CA
      ansible.builtin.command:
        cmd: openssl verify -CAfile /usr/local/share/ca-certificates/rootCA.crt {{ cert_temp_file.path }}
      register: verify_result
      changed_when: false

    - name: Display verification result
      ansible.builtin.debug:
        msg: "Certificate verification: {{ verify_result.stdout }}"

    - name: Fail if verification not OK
      ansible.builtin.fail:
        msg: "Certificate is NOT signed by the root CA! Verification output: {{ verify_result.stdout }}"
      when: "'OK' not in verify_result.stdout"

  always:
    - name: Remove temporary certificate file
      ansible.builtin.file:
        path: "{{ cert_temp_file.path }}"
        state: absent
      ignore_errors: true
