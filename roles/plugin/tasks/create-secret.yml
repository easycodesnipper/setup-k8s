# roles/plugin/tasks/create-secret.yml

- name: "Create or Update Kubernetes Secret: {{ secret_name }}"
  shell: |
    kubectl create secret generic {{ secret_name }} \
      -n {{ secret_namespace }} \
      {% for key, value in secret_data.items() %}
      --from-literal={{ key }}='{{ value }}' \
      {% endfor %}
      --dry-run=client -o yaml | kubectl apply -f -
  vars:
    secret_name: "{{ k8s_secret_name }}"
    secret_namespace: "{{ k8s_secret_namespace }}"
    secret_data: "{{ k8s_secret_data }}"
