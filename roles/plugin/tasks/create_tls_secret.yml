---
# roles/plugin/tasks/create_tls_secret.yml

- name: Ensure target namespace exists for TLS secret
  ansible.builtin.shell: |
    kubectl create namespace {{ tls_secret_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: false

- name: Create or update TLS secret '{{ tls_secret_name }}' in namespace '{{ tls_secret_namespace }}'
  ansible.builtin.shell: |
    kubectl create secret tls {{ tls_secret_name }} \
      --cert={{ tls_cert_file }} \
      --key={{ tls_key_file }} \
      --namespace={{ tls_secret_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: tls_secret_result
  changed_when: "'created' in tls_secret_result.stdout or 'configured' in tls_secret_result.stdout"
