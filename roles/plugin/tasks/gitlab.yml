---
# roles/plugin/tasks/gitlab.yml

- name: "Create secret if not exists"
  tags: plugin-gitlab-preinstall

  block:
    - name: "Check if secret exists"
      ansible.builtin.command: kubectl get secret {{ k8s_plugin_gitlab_smtp_password_secret_name | default('gitlab-smtp-password') }} -n {{
        plugin_config.namespace }} --ignore-not-found
      register: _secret_check
      changed_when: false

    - name: "Build and create secret"
      when: _secret_check.stdout == ""
      block:
        - name: Build secret data dictionary
          ansible.builtin.set_fact:
            _secret_data: >-
              {%- set data = {} -%} {%- set _ = data.update({(k8s_plugin_gitlab_smtp_password_key | default('password')): k8s_plugin_gitlab_smtp_auth_password}) -%}
              {{ data }}

        - ansible.builtin.include_tasks: _create_secret.yml
          vars:
            k8s_secret_namespace: "{{ plugin_config.namespace }}"
            k8s_secret_name: "{{ k8s_plugin_gitlab_smtp_password_secret_name | default('gitlab-smtp-password') }}"
            k8s_secret_data: "{{ _secret_data }}"
          name: "Create secret"
- name: "Install DevOps gitlab"
  ansible.builtin.include_tasks: _install_plugin.yml
  tags: plugin-gitlab-install

# ------------------------------------------------------------------------------
# Post-installation: Automated Runner Token Provisioning
# ------------------------------------------------------------------------------
- name: "Handle GitLab Runner Automatic Registration"
  block:
    - name: "Wait for GitLab database to accept connections"
      ansible.builtin.shell: |
        set -o pipefail
        kubectl exec -n {{ k8s_plugin_gitlab_namespace | default('gitlab-system') }} \
          deployment/gitlab-toolbox -- \
          gitlab-rails runner "puts ActiveRecord::Base.connection.active?" 2>/dev/null | grep -q true
      args:
        executable: /bin/bash
      register: db_check
      retries: 30
      delay: 10
      until: db_check is success
      changed_when: false

    - name: "Get Runner Authentication Token via Rails console"
      ansible.builtin.shell: |
        kubectl exec -n {{ k8s_plugin_gitlab_namespace | default('gitlab-system') }} \
          deployment/{{ k8s_plugin_gitlab_toolbox_deployment | default('gitlab-toolbox') }} \
          -- gitlab-rails runner "
          runner = Ci::Runner.instance_type.first_or_initialize(
            description: 'Auto-Provisioned Gitlab Runner',
            tag_list: ['kubernetes', 'cluster-internal'],
            run_untagged: true
          )
          runner.save!
          puts runner.token"
      register: gitlab_runner_token_output
      changed_when: false

    - name: "Verify that token was retrieved and is valid (starts with 'glrt')"
      ansible.builtin.fail:
        msg: "Failed to retrieve a valid runner token (must start with 'glrt'). Got: {{ gitlab_runner_token_output.stdout_lines | last | default('EMPTY') }}"
      when: >
        gitlab_runner_token_output.stdout_lines | length == 0 or
        (gitlab_runner_token_output.stdout_lines | last | default('') | trim | length == 0) or
        (gitlab_runner_token_output.stdout_lines | last | default('') | trim is not match('^glrt'))

    - name: "Set runner token variable"
      ansible.builtin.set_fact:
        validated_runner_token: "{{ gitlab_runner_token_output.stdout_lines | last | trim }}"

    - name: "Re-run GitLab installation to enable Runner with the new token"
      ansible.builtin.include_tasks: _install_plugin.yml
      vars:
        k8s_plugin_gitlab_runner_token_value: "{{ validated_runner_token }}"

    - name: "Fix runner secret Helm metadata"
      ansible.builtin.shell: |
        ns={{ k8s_plugin_gitlab_namespace | default('gitlab-system') }}
        secret=gitlab-gitlab-runner-secret
        if kubectl get secret -n "$ns" "$secret" &>/dev/null; then
          kubectl patch secret -n "$ns" "$secret" -p '{"metadata":{"labels":{"app.kubernetes.io/managed-by":"Helm"},"annotations":{"meta.helm.sh/release-name":"gitlab","meta.helm.sh/release-namespace":"'$ns'"}}}'
        else
          echo "Secret does not exist, will be created by Helm upgrade"
        fi
      changed_when: false

  when: k8s_plugin_gitlab_runner_install | default(false) | bool
  tags: plugin-gitlab-postinsall
