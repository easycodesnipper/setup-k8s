---
# roles/plugin/tasks/devops-gitlab.yml

- name: "Create secret if not exists"
  block:
    - name: "Check if secret exists"
      command: kubectl get secret {{ k8s_plugin_gitlab_smtp_password_secret_name | default('gitlab-smtp-password') }} -n {{ plugin_config.namespace }} --ignore-not-found
      register: _secret_check
      changed_when: false

    - block:
      - name: Build secret data dictionary
        ansible.builtin.set_fact:
          _secret_data: >-
            {%- set data = {} -%}
            {%- set _ = data.update({ (k8s_plugin_gitlab_smtp_password_key | default('password')): k8s_plugin_gitlab_smtp_auth_password }) -%}
            {{ data }}

      - name: "Create secret"
        include_tasks: _create_secret.yml
        vars:
          k8s_secret_namespace: "{{ plugin_config.namespace }}"
          k8s_secret_name: "{{ k8s_plugin_gitlab_smtp_password_secret_name | default('gitlab-smtp-password') }}"
          k8s_secret_data: "{{ _secret_data }}"
      when: _secret_check.stdout == ""
  tags: plugin-gitlab-preinstall

- name: "Install DevOps gitlab"
  include_tasks: _install_plugin.yml
  tags: plugin-gitlab-install

# ------------------------------------------------------------------------------
# Post-installation: Automated Runner Token Provisioning
# ------------------------------------------------------------------------------
- name: "Handle GitLab Runner Automatic Registration"
  block:
    - name: "Get Runner Authentication Token via Rails console"
      # Execute Rails command inside the webservice pod to generate/retrieve the token
      # The wait logic in _install_plugin.yml ensures the pod is ready here
      shell: |
        kubectl exec -n {{ k8s_plugin_gitlab_namespace | default('gitlab-system') }} \
        deployment/{{ k8s_plugin_gitlab_namespace | default('gitlab-system') }}-webservice-default \
        -c webservice -- gitlab-rails runner "
        runner = Ci::Runner.instance_type.first_or_initialize(
          description: 'Auto-Provisioned K8s Runner',
          tag_list: ['kubernetes', 'cluster-internal'],
          run_untagged: true
        )
        runner.save!
        puts runner.token"
      register: gitlab_runner_token_output
      changed_when: false

    - name: "Re-run GitLab installation to enable Runner with the new token"
      include_tasks: _install_plugin.yml
      vars:
        plugin_name: devops-gitlab
        plugin_config: "{{ k8s_plugins[plugin_name] }}"
        # Override variables to trigger Runner installation in the J2 template
        k8s_plugin_gitlab_runner_install: true
        k8s_plugin_gitlab_runner_token_value: "{{ gitlab_runner_token_output.stdout_lines | last }}"
  
  # Trigger this block only if the global flag for runner installation is set
  when: k8s_plugin_gitlab_runner_install | default(false) | bool
  tags: plugin-gitlab-postinsall
