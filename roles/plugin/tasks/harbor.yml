---
# roles/plugin/tasks/harbor.yml

- name: "Pre-install Harbor"
  block:
    - name: "Extract configuration"
      ansible.builtin.set_fact:
        _config: "{{ k8s_plugins[plugin_name] }}"
      when: k8s_plugins[plugin_name] is defined

    - name: "Create namespace {{ _config.namespace }}"
      ansible.builtin.shell: |
        kubectl create namespace {{ _config.namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false
      when: _config is defined

    - name: "Check if Harbor secrets already exist in {{ _config.namespace }}"
      ansible.builtin.command: >
        kubectl get secret harbor-admin-password -n {{ _config.namespace }} --ignore-not-found
      register: _harbor_secret_check
      changed_when: false
      failed_when: false
      when: _config is defined

    - name: "Generate random admin password if secret does not exist"
      ansible.builtin.set_fact:
        _harbor_admin_password: "{{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
      no_log: true # Prevent the random password from being logged in the console or logs
      when: _config is defined and _harbor_secret_check.stdout == ""

    - name: "Create Harbor admin password secret"
      include_tasks: create-secret.yml
      vars:
        k8s_secret_namespace: "{{ _config.namespace }}"
        k8s_secret_name: "harbor-admin-password"
        k8s_secret_data:
          # Key 'secret' is mandatory for Harbor's internal auth logic (existingSecret)
          secret: "{{ _harbor_admin_password }}"
          # Key 'HARBOR_ADMIN_PASSWORD' is required by harbor-core env variables
          HARBOR_ADMIN_PASSWORD: "{{ _harbor_admin_password }}"
      no_log: true
      when: _config is defined and _harbor_secret_check.stdout == ""
  tags:
    - plugin-harbor-preinstall

- name: "Install Harbor"
  include_tasks: _install_plugin.yml
  tags: 
    - plugin-harbor-install

- name: "Harbor API | Initialize registry mirror(s)"
  include_tasks: harbor-init-mirror.yml
  loop: "{{ k8s_plugin_harbor_mirrors | default([]) }}"
  loop_control:
    loop_var: mirror_item
  when: 
    - k8s_plugin_harbor_init_mirror | default(true) | bool
    - k8s_plugin_harbor_mirrors | length > 0
  tags: 
    - plugin-harbor-postinstall
