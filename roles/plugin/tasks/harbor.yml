---
# roles/plugin/tasks/harbor.yml

- name: "Create secret if not exists"
  tags: plugin-harbor-preinstall

  block:
    - name: "Check if secret exists"
      ansible.builtin.command: kubectl get secret {{ k8s_harbor_admin_password_secret_name | default('harbor-admin-password') }} -n {{ plugin_config.namespace
        }} --ignore-not-found
      register: _secret_check
      changed_when: false

    - name: "Create secret"
      when: _secret_check.stdout == ""
      block:
        - name: Set decision fact
          ansible.builtin.set_fact:
            _harbor_admin_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
          no_log: true

        - name: "Create Harbor admin password secret"
          ansible.builtin.include_tasks: _create_secret.yml
          vars:
            k8s_secret_namespace: "{{ plugin_config.namespace }}"
            k8s_secret_name: "{{ k8s_harbor_admin_password_secret_name | default('harbor-admin-password') }}"
            k8s_secret_data:
              secret: "{{ _harbor_admin_password }}"
              HARBOR_ADMIN_PASSWORD: "{{ _harbor_admin_password }}"
          no_log: true
          tags:
            - plugin-harbor-preinstall
- name: "Install Harbor"
  ansible.builtin.include_tasks: _install_plugin.yml
  tags: plugin-harbor-install

# ------------------------------------------------------------------------------
# Post-installation: Initialize registry mirrors like docker.io,...etc.
# ------------------------------------------------------------------------------
- name: "Harbor API | Initialize registry mirror(s)"
  ansible.builtin.include_tasks: _harbor_init_mirror.yml
  loop: "{{ k8s_plugin_harbor_mirrors | default([]) }}"
  loop_control:
    loop_var: mirror_item
  when:
    - k8s_plugin_harbor_mirrors_enabled | default(true) | bool
    - k8s_plugin_harbor_mirrors | length > 0
  tags:
    - plugin-harbor-postinstall
