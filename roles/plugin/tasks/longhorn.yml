---
# roles/plugin/tasks/longhorn.yml

- name: Install iSCSI on all nodes
  ansible.builtin.include_tasks: _longhorn_iscsi.yml
  loop: "{{ groups['k8s_cluster'] }}"
  loop_control:
    label: "Install iSCSI on {{ node_item }}"
    loop_var: node_item
  tags: plugin-longhorn-preinstall

- name: Install Longhorn
  ansible.builtin.include_tasks: _install_plugin.yml
  tags: plugin-longhorn-install

- name: Create Longhorn RWX StorageClass
  ansible.builtin.shell: |
    set -o pipefail
    cat <<EOF | kubectl apply -f -
    {{ lookup('template', '_longhorn_rwx_sc.yaml.j2') }}
    EOF
  args:
    executable: /bin/bash
  register: sc_output
  changed_when: "'configured' in sc_output.stdout or 'created' in sc_output.stdout"
  tags: plugin-longhorn-postinstall
