---
# roles/plugin/tasks/longhorn.yml

- name: Install iSCSI on all nodes
  include_tasks: longhorn-iscsi.yml
  loop: "{{ groups['k8s_cluster'] }}"
  loop_control:
    label: "Install iSCSI on {{ node_item }}"
    loop_var: node_item

- name: Install Longhorn
  include_tasks: _install_plugin.yml
  vars:
    plugin_name: longhorn
    plugin_config: "{{ k8s_plugins[plugin_name] }}"
  tags: plugin-longhorn

- name: Create Longhorn RWX StorageClass
  ansible.builtin.shell: |
    cat <<EOF | kubectl apply -f -
    {{ lookup('template', 'longhorn-rwx-sc.yaml.j2') }}
    EOF
  args:
    executable: /bin/bash
  register: sc_output
  changed_when: "'configured' in sc_output.stdout or 'created' in sc_output.stdout"
