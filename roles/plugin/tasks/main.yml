---
# roles/plugin/tasks/main.yml

- name: "Install plugins"
  tags: "plugins-install"
  block:
    - name: Determine raw input for k8s_plugins_only
      ansible.builtin.set_fact:
        _raw_input: "{{ k8s_plugins_only | default('') if k8s_plugins_only is defined else '' }}"

    - name: Convert raw input to list (handles both string and list)
      ansible.builtin.set_fact:
        _as_list: >-
          {{
            [] if _raw_input == '' or _raw_input | length == 0
            else (_raw_input | split(',') | map('trim') | select('string') | list)
              if _raw_input is string
            else (_raw_input | map('trim') | select('string') | list)
          }}

    - name: Get plugins enabled via k8s_plugins[].enabled
      ansible.builtin.set_fact:
        _enabled_plugins: >-
          {{
            k8s_plugins | dict2items
            | selectattr('value.enabled', 'defined')
            | selectattr('value.enabled', 'equalto', true)
            | list
          }}

    - name: Filter plugins by explicit names (k8s_plugins_only)
      ansible.builtin.set_fact:
        _filtered_plugins: >-
          {{
            k8s_plugins | dict2items
            | selectattr('key', 'in', _as_list)
            | list
          }}

    - name: Decide which plugins to install
      ansible.builtin.set_fact:
        _plugins_to_install: "{{ _filtered_plugins if (_as_list | length > 0) else _enabled_plugins }}"

    - name: Terminate if no plugins were identified for installation
      ansible.builtin.meta: end_play
      when: _plugins_to_install | length == 0

    - name: Confirm plugins installation
      block:
        - name: Show plugins and request confirmation
          ansible.builtin.pause:
            prompt: |
              ======================================================================
                                      INSTALLATION SUMMARY
              ======================================================================
              The following Kubernetes plugins are scheduled for installation:

              {% for item in _plugins_to_install %}
                • {{ item.key }}
              {% endfor %}

              WARNING: This will modify your cluster configuration.
              Type 'y' to continue, or any other key to abort.
              ======================================================================
          register: _pause_status

        - name: Terminate if not confirmed
          ansible.builtin.meta: end_play
          when: _pause_status.user_input | default('y') | lower != 'y'

      when: not ansible_check_mode

    - name: Install Kubernetes plugins
      ansible.builtin.include_tasks: "{{ item.key }}.yml"
      vars:
        plugin_name: "{{ item.key }}"
        plugin_config: "{{ item.value }}"
      loop: "{{ _plugins_to_install }}"
      loop_control:
        label: "Plugin: {{ item.key }}"
      when: k8s_plugins is mapping
