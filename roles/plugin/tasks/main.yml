---
- name: Install Kubernetes plugins
  when: k8s_plugins is mapping
  vars:
    active_plugins: "{{ k8s_plugins | dict2items | selectattr('value.enabled', 'defined') | selectattr('value.enabled', 'equalto', true) | list }}"
  block:
    - name: "Execute plugin installation tasks"
      include_tasks: "{{ item.key }}.yml"
      vars:
        plugin_name: "{{ item.key }}"
        plugin_config: "{{ item.value }}"
      loop: "{{ active_plugins }}"
      loop_control:
        label: "Plugin: {{ item.key }}"
