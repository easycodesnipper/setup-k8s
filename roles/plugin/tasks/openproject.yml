---
# roles/plugin/tasks/openproject.yml

- name: "Create secret if not exists"
  tags: plugin-openproject-preinstall

  block:
    - name: "Check if secret exists"
      ansible.builtin.command: kubectl get secret {{ k8s_plugin_openproject_existing_secret | default('openproject-passwords') }} -n {{ plugin_config.namespace
        }} --ignore-not-found
      register: _secret_check
      changed_when: false

    - name: "Create secret"
      when: _secret_check.stdout == ""
      block:
        - name: Generate random passwords
          ansible.builtin.set_fact:
            _user_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
            _admin_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

        - name: Build secret data dictionary
          ansible.builtin.set_fact:
            _secret_data: >-
              {%- set data = {} -%} {%- set _ = data.update({(k8s_plugin_openproject_postgresql_user_password_key | default('postgresql-password')): _user_password})
              -%} {%- set _ = data.update({(k8s_plugin_openproject_postgresql_postgres_password_key | default('postgresql-postgres-password')): _admin_password})
              -%} {{ data }}

        - name: "Create secret"
          ansible.builtin.include_tasks: _create_secret.yml
          vars:
            k8s_secret_namespace: "{{ plugin_config.namespace }}"
            k8s_secret_name: "{{ k8s_plugin_openproject_existing_secret | default('openproject-passwords') }}"
            k8s_secret_data: "{{ _secret_data }}"
- name: "Install DevOps Openproject"
  ansible.builtin.include_tasks: _install_plugin.yml
  tags: plugin-openproject-install
