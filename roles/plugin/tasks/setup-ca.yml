---
# roles/plugin/tasks/setup-ca.yml

- name: Create Required Namespace
  ansible.builtin.shell: |
    kubectl create namespace {{ k8s_ca_namespace | default('ca-system') }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Setup system-wide mkcert CA and distribute to all cluster nodes
  block:
    - name: Ensure mkcert is installed (system)
      become: true
      ansible.builtin.apt:
        name: mkcert
        state: present

    - name: Check if system-wide mkcert CA already installed (root)
      become: true
      ansible.builtin.stat:
        path: /root/.local/share/mkcert/rootCA.pem
      register: mkcert_ca_installed

    - name: Initialize system-wide mkcert CA (if not present)
      become: true
      ansible.builtin.command: mkcert -install
      when: not mkcert_ca_installed.stat.exists
      changed_when: true

    - name: Get mkcert CA root directory (system)
      become: true
      ansible.builtin.command: mkcert -CAROOT
      register: mkcert_caroot
      changed_when: false

    - name: Create temporary directory for certificate generation
      become: false
      ansible.builtin.tempfile:
        state: directory
        suffix: _k8s_ca
      register: cert_temp_dir

    - name: Generate wildcard certificates (using system CA)
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        mkcert -cert-file {{ cert_temp_dir.path }}/wildcard.pem \
               -key-file {{ cert_temp_dir.path }}/wildcard-key.pem \
               {{ cert_domains_list | join(' ') }}
      vars:
        cert_domains_list: "{{ k8s_plugin_ca_cert_domains | default(['gitlab.localdomain', 'longhorn.localdomain', '*.localdomain', 'localhost', '127.0.0.1']) }}"
      args:
        executable: /bin/bash

    - name: Fix permissions on temporary directory and certificate files
      become: true
      ansible.builtin.file:
        path: "{{ cert_temp_dir.path }}"
        state: directory
        mode: '0755'
        recurse: yes

    - name: Read CA certificate content (rootCA.pem)
      become: true
      ansible.builtin.slurp:
        src: "{{ mkcert_caroot.stdout.strip() }}/rootCA.pem"
      register: ca_content_b64

    # How to check consistency of CA certificate across all nodes
    # ansible -i inventory.ini k8s_cluster -m shell -a "ls -l /etc/ssl/certs | grep rootCA"
    # ansible localhost -m shell -a "ls -l /etc/ssl/certs | grep rootCA"
    # ansible -i inventory.ini k8s_cluster -m shell -a "sha256sum /usr/local/share/ca-certificates/rootCA.crt | awk '{print $1}'"
    # ansible localhost -m shell -a "sha256sum /usr/local/share/ca-certificates/rootCA.crt | awk '{print $1}'"
    - name: "Local & Cluster | Distribute CA certificate"
      become: true
      ansible.builtin.copy:
        content: "{{ ca_content_b64['content'] | b64decode }}"
        dest: "/usr/local/share/ca-certificates/rootCA.crt"
        mode: '0644'
      delegate_to: "{{ node_item }}"
      loop: "{{ groups['k8s_cluster'] + ['localhost'] }}"
      loop_control:
        loop_var: node_item
        label: "Distributing CA to node {{ node_item }}"

    - name: "Local & Cluster | Update CA trust store"
      become: true
      ansible.builtin.command: update-ca-certificates --fresh
      delegate_to: "{{ node_item }}"
      loop: "{{ groups['k8s_cluster'] + ['localhost'] }}"
      loop_control:
        loop_var: node_item
        label: "Updating CA trust store on {{ node_item }}"

  rescue:
    - name: Cleanup temporary certificate directory on failure
      become: false
      ansible.builtin.file:
        path: "{{ cert_temp_dir.path }}"
        state: absent
      when: cert_temp_dir.path is defined
      ignore_errors: true

- name: Deploy CA Server and Ingress
  block:
    - name: Create temporary directory for ConfigMap files
      become: false
      ansible.builtin.tempfile:
        state: directory
        suffix: _ca_configmap
      register: cm_temp_dir

    - name: Write index.html to temporary file
      become: false
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>CA Certificate Distribution</title></head>
          <body>
            <h1>Internal Root CA</h1>
            <p>Click the link below to download the certificate:</p>
            <a href="/rootCA.pem" download="rootCA.pem">Download rootCA.pem</a>
          </body>
          </html>
        dest: "{{ cm_temp_dir.path }}/index.html"

    - name: Write rootCA.pem to temporary file
      become: false
      ansible.builtin.copy:
        content: "{{ ca_content_b64['content'] | b64decode }}"
        dest: "{{ cm_temp_dir.path }}/rootCA.pem"

    - name: Create ConfigMap for CA distribution
      become: false
      ansible.builtin.shell: |
        kubectl create configmap ca-dist-config \
          --from-file={{ cm_temp_dir.path }}/rootCA.pem \
          --from-file={{ cm_temp_dir.path }}/index.html \
          --namespace={{ k8s_plugin_ca_namespace | default('ca-system') }} \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create TLS secret from wildcard certificates
      include_tasks: create_tls_secret.yml
      vars:
        tls_secret_name: "{{ k8s_plugin_ca_tls_secret_name | default('mkcert-wildcard-tls') }}"
        tls_secret_namespace: "{{ k8s_plugin_ca_namespace | default('ca-system') }}"
        tls_cert_file: "{{ cert_temp_dir.path }}/wildcard.pem"
        tls_key_file: "{{ cert_temp_dir.path }}/wildcard-key.pem"

    - name: Apply CA Server Manifests
      become: false
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        {{ lookup('template', 'ca-server-manifest.yaml.j2') }}
        EOF
      args:
        executable: /bin/bash
      changed_when: false

  always:
    - name: Cleanup temporary certificate directory
      become: false
      ansible.builtin.file:
        path: "{{ cert_temp_dir.path }}"
        state: absent
      when: cert_temp_dir.path is defined
      ignore_errors: true

    - name: Cleanup temporary ConfigMap directory
      become: false
      ansible.builtin.file:
        path: "{{ cm_temp_dir.path }}"
        state: absent
      when: cm_temp_dir.path is defined
      ignore_errors: true

