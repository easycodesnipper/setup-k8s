---
# roles/plugin/tasks/setup_mkcert.yml

- name: Ensure mkcert is installed on Controller
  ansible.builtin.apt:
    name: mkcert
    state: present

- name: Initialize mkcert CA on Controller
  ansible.builtin.command: mkcert -install
  register: mkcert_init
  changed_when: "'The local CA is already installed' not in mkcert_init.stderr"

- name: Get mkcert CA ROOT path
  ansible.builtin.command: mkcert -CAROOT
  register: mkcert_caroot
  changed_when: false

- name: Generate wildcard certificates for specified domains
  ansible.builtin.shell: |
    set -o pipefail
    cd /tmp
    # Join the list into a space-separated string for mkcert
    mkcert -cert-file wildcard.pem -key-file wildcard-key.pem {{ cert_domains_list | join(' ') }}
  vars:
    # Default list includes wildcard, root domain, and localhost
    cert_domains_list: "{{ k8s_plugin_cert_domains | default(['*.localdomain', 'localdomain', '127.0.0.1']) }}"
  args:
    executable: /bin/bash
    # Note: Using 'creates' might skip generation if you change the domain list.
    # Consider removing 'creates' if you want to force updates when variables change.
    creates: /tmp/wildcard.pem

- name: Ensure Traefik namespace exists
  ansible.builtin.shell: |
    kubectl create namespace {{ k8s_plugin_traefik_namespace | default('traefik-system') }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Inject Wildcard Secret into K8s
  ansible.builtin.shell: |
    kubectl create secret tls {{ k8s_plugin_traefik_tlsstore_default_secretname | default('mkcert-wildcard-tls') }} \
      --cert=/tmp/wildcard.pem \
      --key=/tmp/wildcard-key.pem \
      --namespace={{ k8s_plugin_traefik_namespace | default('traefik-system') }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash

- name: Create ConfigMap for root CA distribution
  ansible.builtin.shell: |
    kubectl create configmap ca-dist-config \
      --from-file=rootCA.pem={{ mkcert_caroot.stdout }}/rootCA.pem \
      --namespace={{ k8s_plugin_traefik_namespace | default('traefik-system') }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash

- name: Create ConfigMap for CA distribution with index.html
  ansible.builtin.shell: |
    kubectl create configmap ca-dist-config \
      --from-file=rootCA.pem={{ mkcert_caroot.stdout }}/rootCA.pem \
      --from-literal=index.html='<!DOCTYPE html>
      <html>
      <head><title>CA Certificate Distribution</title></head>
      <body>
        <h1>Internal Root CA</h1>
        <p>Click the link below to download the certificate:</p>
        <a href="/rootCA.pem" download="rootCA.pem">Download rootCA.pem</a>
      </body>
      </html>
      ' \
      --namespace={{ k8s_plugin_traefik_namespace | default("traefik-system") }} \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash

- name: Deploy CA Server manifests via template
  ansible.builtin.shell:
    cmd: |
      cat <<EOF | kubectl apply -f -
      {{ lookup('template', 'ca-server-manifest.yaml.j2') }}
      EOF
    executable: /bin/bash

- name: Cleanup temporary cert files on Controller
  ansible.builtin.file:
    path: "{{ cert_file_path }}"
    state: absent
  loop:
    - /tmp/wildcard.pem
    - /tmp/wildcard-key.pem
  loop_control:
    loop_var: cert_file_path
    label: "Cleaning up: {{ cert_file_path }}"
