---
# roles/plugin/tasks/setup_ca_ingress.yml
# This task deploys the Ingress for Root CA distribution.
# It is separated from the base deployment to ensure Traefik is ready.

- name: Deploy CA Server Ingress via kubectl
  ansible.builtin.shell:
    cmd: |
      cat <<EOF | kubectl apply -f -
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ca-server-ingress
        namespace: {{ k8s_plugin_traefik_namespace | default('traefik-system') }}
        annotations:
          # Use the 'web' entrypoint specifically
          traefik.ingress.kubernetes.io/router.entrypoints: web
          
          # Explicitly set empty middlewares to ensure global redirects 
          # or other default middlewares do not interfere with CA download.
          traefik.ingress.kubernetes.io/router.middlewares: ""
          
          # Priority is set higher to ensure this host-specific rule 
          # is evaluated before any generic catch-all rules.
          traefik.ingress.kubernetes.io/router.priority: "1000"
      spec:
        ingressClassName: {{ k8s_plugin_traefik_ingress_class | default('traefik') }}
        rules:
        - host: {{ k8s_plugin_ca_server_domain | default('ca.localdomain') }}
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: ca-server
                  port:
                    number: 80
      EOF
    executable: /bin/bash
  tags:
    - plugin-traefik
    - cert-setup

- name: Verify CA Server Ingress Status
  ansible.builtin.command:
    cmd: "kubectl get ingress ca-server-ingress -n {{ k8s_plugin_traefik_namespace | default('traefik-system') }}"
  register: ingress_check
  changed_when: false
