---
# roles/plugin/tasks/traefik.yml

- name: Setup CA
  ansible.builtin.include_tasks: _setup_ca.yml
- name: Install Traefik Ingress
  ansible.builtin.include_tasks: _install_plugin.yml
  vars:
    plugin_name: traefik
    plugin_config: "{{ k8s_plugins[plugin_name] }}"
  tags: plugin-traefik

- name: Create Global HTTPS Redirect Middleware
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cat <<EOF | kubectl apply -f -
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: {{ k8s_plugin_traefik_middleware | default('redirect-https') }}
        namespace: {{ k8s_plugin_traefik_namespace | default('traefik-system') }}
      spec:
        redirectScheme:
          scheme: https
          permanent: true
      EOF
    executable: /bin/bash
  register: middleware_result
  until: middleware_result.rc == 0
  retries: 5
  delay: 5
  changed_when: "'created' in middleware_result.stdout or 'configured' in middleware_result.stdout"
  tags:
    - plugin-traefik
    - plugin-traefik-setup-middleware

- name: Create SSH tunnel for Traefik ingress
  ansible.builtin.include_tasks: _ingress_ssh_tunnel.yml
  tags: plugin-traefik
