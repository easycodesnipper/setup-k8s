---
- name: Check if prerequisite setup was already completed
  stat:
    path: "{{ k8s_prereq_completed_file }}"
  register: prereq_done
  ignore_errors: true
  check_mode: false

- block:
  - name: Gather facts
    setup:
    when: ansible_os_family is not defined

  - name: Check if dev-zram0.swap unit exists
    command: systemctl list-unit-files dev-zram0.swap
    register: zram_unit_check
    changed_when: false
    failed_when: false
    check_mode: no

  - name: Mask dev-zram0.swap unit
    systemd:
      name: dev-zram0.swap
      masked: yes
      state: stopped
    when: "'dev-zram0.swap' in zram_unit_check.stdout"

  - name: Disable all swap devices
    command: swapoff -a
    tags: swap

  - name: Comment out swap entries in /etc/fstab
    lineinfile:
      path: /etc/fstab
      regexp: '^\s*.*\sswap\s+'
      line: '#\g<0>'
      backrefs: yes
      state: present
    notify: Remount filesystems
    tags: swap

  - name: Load required kernel modules
    modprobe:
      name: "{{ item }}"
      state: present
    loop: "{{ k8s_kernel_modules }}"
    tags: kernel

  - name: Ensure kernel modules load on boot
    lineinfile:
      path: /etc/modules-load.d/k8s.conf
      line: "{{ item }}"
      create: yes
      owner: root
      group: root
      mode: 0644
    loop: "{{ k8s_kernel_modules }}"
    notify: Reload sysctl
    tags: kernel

  - name: Ensure sysctl settings are applied
    sysctl:
      name: "{{ item.key }}"
      value: "{{ item.value }}"
      state: present
      reload: yes
    loop: "{{ k8s_sysctl_settings | dict2items }}"
    tags: sysctl

  - name: Configure Kubernetes sysctl parameters
    template:
      src: k8s.conf.j2
      dest: /etc/sysctl.d/k8s.conf
      owner: root
      group: root
      mode: 0644
    notify: Reload sysctl
    tags: sysctl

  - name: Configure Kubernetes cluster hosts in /etc/hosts
    blockinfile:
      path: /etc/hosts
      insertafter: EOF
      create: true
      # The 'marker' helps manage the block and makes it easy to remove later
      marker: "# {mark} ANSIBLE MANAGED BLOCK - K8S HOSTS MAPPING"
      block: |
        {% for host in groups['k8s_cluster'] %}
        {{ hostvars[host].ansible_host }} {{ host }}
        {% endfor %}
    tags: host-mapping
  
  - name: Create flag file to indicate prerequisites are done
    copy:
      content: "Kubernetes prerequisites setup completed"
      dest: "{{ k8s_prereq_completed_file }}"
      owner: root
      group: root
      mode: 0644
  when: not prereq_done.stat.exists