---
- name: Check if node is already joined to cluster
  shell: "kubectl get node {{ inventory_hostname }} >/dev/null"
  delegate_to: "{{ groups['masters'][0] }}"
  register: node_check_result
  changed_when: false
  ignore_errors: true

- block:
  - name: Get join command from master
    slurp:
      src: "{{ k8s_join_cmd_file }}"
    delegate_to: "{{ groups['masters'][0] }}"
    register: join_command_file
    failed_when: false

  - name: Join worker to cluster
    become: yes
    command: "{{ join_command_file.content | b64decode }}"
  when: node_check_result.rc != 0

- name: Wait for node to be ready
  command: >
    kubectl wait --for=condition=Ready node/{{ inventory_hostname | quote }} --timeout={{ k8s_wait_node_ready_timeout }}
  delegate_to: "{{ groups['masters'][0] }}"
  register: wait_result
  retries: 3
  delay: 10
  until: wait_result.rc == 0
  failed_when: wait_result.rc != 0 and 'timeout' not in wait_result.stderr
  tags: wait-node-ready
